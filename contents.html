<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --orange-press:#d9760f;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --green-press:#349d6e;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:460px; width:100%; margin:0 auto; padding:20px 22px 28px; display:flex; flex-direction:column; min-height:100dvh;}

  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back{appearance:none; background:none; border:0; padding:8px; margin:-8px 0 -8px -8px; cursor:pointer; color:var(--paper); text-decoration:none; display:flex;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .rule{height:6px; margin:0 0 26px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}

  .modeToggle{display:flex; gap:0; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:4px; margin-bottom:24px;}
  .modeToggle button{flex:1; appearance:none; border:0; background:transparent; color:var(--muted);
    padding:12px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; border-radius:9px;}
  .modeToggle button.active{background:var(--orange); color:var(--ink);}

  .field{margin-bottom:20px;}
  label{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  select,input{width:100%; appearance:none; background:var(--field); color:var(--paper);
    border:1.5px solid var(--line); border-radius:12px; padding:16px 15px; font-size:17px; font-family:inherit;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%239a9a9a' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:42px;}
  select:focus, input:focus{outline:none; border-color:var(--orange);}

  .req{color:var(--orange); font-weight:700; margin-left:2px;}

  .itemsList{margin-top:16px;}
  .itemsList .empty{color:var(--muted); font-style:italic; text-align:center; padding:20px 0; font-size:14px;}

  .lineItem{display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .lineItem .info{flex:1; min-width:0;}
  .lineItem .name{font-size:15px; font-weight:600; color:var(--paper); overflow:hidden; text-overflow:ellipsis;}
  .lineItem .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .lineItem .qty{display:flex; align-items:center; gap:8px;}
  .lineItem .qtyInput{width:52px; padding:8px; text-align:center; font-size:16px;}
  .lineItem .remove{appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:4px; font-size:20px; line-height:1;}

  .addRow{margin-top:10px;}
  .addBtn{appearance:none; background:transparent; border:1.5px dashed var(--gray); color:var(--paper);
    border-radius:12px; padding:14px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; width:100%;}
  .addBtn:hover{border-color:var(--orange); color:var(--orange);}

  /* Item picker overlay */
  .pickerOverlay{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50;
    display:none; align-items:flex-end; justify-content:center;}
  .pickerOverlay.show{display:flex;}
  .pickerSheet{background:var(--bg); width:100%; max-width:460px; border-radius:20px 20px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:85vh; display:flex; flex-direction:column;}
  .pickerTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .pickerTitle{font-family:Georgia,serif; font-size:19px; color:var(--paper);}
  .pickerClose{appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:4px;}
  .searchBox{margin-bottom:10px;}
  .searchBox input{padding:12px 15px; font-size:16px;}
  .resultList{overflow-y:auto; flex:1;}
  .resultRow{padding:14px; border-bottom:1px solid var(--line); cursor:pointer; color:var(--paper);}
  .resultRow:last-child{border-bottom:none;}
  .resultRow:hover, .resultRow.hilite{background:rgba(246,137,34,.14);}
  .resultRow .rName{font-size:15px; font-weight:600;}
  .resultRow .rMeta{font-size:12px; color:var(--muted); margin-top:2px;}
  .resultRow.low{border-left:3px solid var(--danger);}
  .resultRow .lowBadge{display:inline-block; background:var(--danger); color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:8px; vertical-align:middle;}

  .submit{appearance:none; border:0; border-radius:16px; padding:22px; font-size:19px; font-weight:700; font-family:inherit;
    background:var(--orange); color:var(--ink); cursor:pointer; width:100%; margin-top:20px; transition:transform .06s, background .15s;}
  .submit:active{transform:scale(.985); background:var(--orange-press);}
  .submit:disabled{opacity:.7; cursor:default;}
  .submit.restock{background:var(--green);}
  .submit.restock:active{background:var(--green-press);}

  /* Done screen */
  .done{display:none; flex-direction:column; align-items:center; text-align:center; flex:1; justify-content:center; padding:20px 0;}
  .done.show{display:flex;}
  .check{width:84px; height:84px; border-radius:50%; background:rgba(63,178,127,.14); display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .done h2{font-family:Georgia,serif; font-size:26px; margin:0 0 10px;}
  .done p{color:var(--paper); font-size:17px; margin:0 0 6px; line-height:1.45;}
  .done .acts{display:flex; flex-direction:column; gap:12px; width:100%; margin-top:30px;}
  .ghost{appearance:none; border:2px solid var(--gray); background:transparent; color:var(--paper);
    border-radius:14px; padding:18px; font-size:17px; font-weight:600; font-family:inherit; cursor:pointer; text-decoration:none; text-align:center;}
  .solid{appearance:none; border:0; background:var(--orange); color:var(--ink);
    border-radius:14px; padding:18px; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer; text-decoration:none; text-align:center;}

  .errBox{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:12px; padding:16px; margin-bottom:16px; color:var(--paper); font-size:14px; display:none;}
  .errBox.show{display:block;}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--orange); color:var(--ink); font-weight:700; padding:12px 18px; border-radius:12px;
    opacity:0; pointer-events:none; transition:.25s; font-size:14px; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

      <span class="htitle">Contents</span>
    </div>
    <div class="rule"></div>

    <div id="mainForm">
      <div class="modeToggle">
        <button id="modeTake" class="active" type="button">Take</button>
        <button id="modeRestock" type="button">Restock</button>
      </div>

      <div class="errBox" id="errBox"></div>

      <div class="field">
        <label for="name">Your name <span class="req">*</span></label>
        <select id="name">
          <option value="" selected disabled>Loading...</option>
        </select>
      </div>

      <div class="field">
        <label>Items <span class="req">*</span></label>
        <div class="itemsList" id="itemsList">
          <div class="empty">No items added yet</div>
        </div>
        <div class="addRow">
          <button type="button" class="addBtn" id="addItemBtn">+ Add item</button>
        </div>
      </div>

      <div class="field">
        <label for="reason" id="reasonLabel">Job / destination <span class="req">*</span></label>
        <input id="reason" type="text" placeholder="Where is this going or PO#" autocomplete="off">
      </div>

      <button class="submit" id="submit">Submit</button>
    </div>

    <!-- Confirmation -->
    <div class="done" id="doneScreen">
      <div class="check">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3fb27f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h2 id="doneTitle">Done</h2>
      <p id="doneLine"></p>
      <div class="acts">
        <button class="solid" id="another">Do another</button>
        <a class="ghost" href="index.html">Back to home</a>
      </div>
    </div>
  </main>

  <!-- Item picker -->
  <div class="pickerOverlay" id="pickerOverlay">
    <div class="pickerSheet">
      <div class="pickerTop">
        <div class="pickerTitle">Pick an item</div>
        <button class="pickerClose" id="pickerClose" aria-label="Close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="searchBox">
        <input type="text" id="pickerSearch" placeholder="Search items..." autocomplete="off">
      </div>
      <div class="resultList" id="resultList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const GET_LISTS_URL    = "https://haggertybuilds.app.n8n.cloud/webhook/shop-lists";
    const TAKE_URL         = "https://haggertybuilds.app.n8n.cloud/webhook/record-take";
    const RESTOCK_URL      = "https://haggertybuilds.app.n8n.cloud/webhook/record-restock";

    const CACHE_KEY = 'haggerty_shop_lists_v1';
    const CACHE_MINUTES = 5;

    let mode = 'take'; // 'take' or 'restock'
    let cachedData = null;
    let addedItems = []; // {itemId, item, quantity}
    let t;

    function toast(m){
      const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show');
      clearTimeout(t); t=setTimeout(()=>el.classList.remove('show'),1800);
    }

    function readCache(){
      try{
        const raw = sessionStorage.getItem(CACHE_KEY);
        if(!raw) return null;
        const obj = JSON.parse(raw);
        if(Date.now() - (obj.savedAt||0) > CACHE_MINUTES*60*1000) return null;
        return obj.data;
      } catch(e){ return null; }
    }
    function writeCache(data){
      try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify({savedAt: Date.now(), data})); } catch(e){}
    }

    function fillNames(data){
      cachedData = data;
      const sel = document.getElementById('name');
      sel.innerHTML = '<option value="" selected disabled>Select your name</option>';
      (data.people || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
    }

    async function loadData(){
      const cached = readCache();
      if (cached) fillNames(cached);
      try{
        const res = await fetch(GET_LISTS_URL, {cache:'no-store'});
        const data = await res.json();
        writeCache(data);
        fillNames(data);
      } catch(e){
        if(!cached) toast('Could not load list - refresh');
      }
    }

    // Mode toggle
    document.getElementById('modeTake').addEventListener('click', () => setMode('take'));
    document.getElementById('modeRestock').addEventListener('click', () => setMode('restock'));

    function setMode(newMode){
      mode = newMode;
      document.getElementById('modeTake').classList.toggle('active', newMode === 'take');
      document.getElementById('modeRestock').classList.toggle('active', newMode === 'restock');
      const submit = document.getElementById('submit');
      const reasonLabel = document.getElementById('reasonLabel');
      const reasonInput = document.getElementById('reason');
      if (newMode === 'take') {
        submit.textContent = 'Take supplies';
        submit.classList.remove('restock');
        reasonLabel.innerHTML = 'Job / destination <span class="req">*</span>';
        reasonInput.placeholder = 'Where is this going';
      } else {
        submit.textContent = 'Restock supplies';
        submit.classList.add('restock');
        reasonLabel.innerHTML = 'Supplier / PO# <span class="req">*</span>';
        reasonInput.placeholder = 'Grainger PO#12345';
      }
    }

    // Item picker
    document.getElementById('addItemBtn').addEventListener('click', () => {
      openPicker();
    });

    function openPicker(){
      const overlay = document.getElementById('pickerOverlay');
      const search = document.getElementById('pickerSearch');
      search.value = '';
      renderPickerResults('');
      overlay.classList.add('show');
      setTimeout(() => search.focus(), 100);
    }

    document.getElementById('pickerClose').addEventListener('click', () => {
      document.getElementById('pickerOverlay').classList.remove('show');
    });
    document.getElementById('pickerOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'pickerOverlay') e.currentTarget.classList.remove('show');
    });
    document.getElementById('pickerSearch').addEventListener('input', (e) => {
      renderPickerResults(e.target.value);
    });

    function renderPickerResults(query){
      const list = document.getElementById('resultList');
      list.innerHTML = '';
      const contents = (cachedData && cachedData.contents) || [];
      const q = query.trim().toLowerCase();
      // Filter out already-added items
      const addedIds = addedItems.map(i => i.itemId);
      const available = contents.filter(c => !addedIds.includes(c.id));
      const matches = q === ''
        ? available
        : available.filter(c => c.item.toLowerCase().includes(q));
      if (matches.length === 0){
        const empty = document.createElement('div');
        empty.style.padding = '20px';
        empty.style.textAlign = 'center';
        empty.style.color = 'var(--muted)';
        empty.textContent = q === '' ? 'All items already added' : 'No matches';
        list.appendChild(empty);
        return;
      }
      matches.forEach(c => {
        const isLow = c.threshold > 0 && c.quantity < c.threshold;
        const row = document.createElement('div');
        row.className = 'resultRow' + (isLow ? ' low' : '');
        const lowBadge = isLow ? '<span class="lowBadge">LOW</span>' : '';
        row.innerHTML = '<div class="rName">' + c.item + lowBadge + '</div>' +
                        '<div class="rMeta">On hand: ' + c.quantity + ' ' + c.unit + (c.category ? ' &middot; ' + c.category : '') + '</div>';
        row.addEventListener('click', () => {
          addItem(c);
          document.getElementById('pickerOverlay').classList.remove('show');
        });
        list.appendChild(row);
      });
    }

    function addItem(contentsItem){
      addedItems.push({
        itemId: contentsItem.id,
        item: contentsItem.item,
        unit: contentsItem.unit,
        quantity: 1,
        currentStock: contentsItem.quantity
      });
      renderAddedItems();
    }

    function renderAddedItems(){
      const list = document.getElementById('itemsList');
      list.innerHTML = '';
      if (addedItems.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No items added yet';
        list.appendChild(empty);
        return;
      }
      addedItems.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'lineItem';
        row.innerHTML = '<div class="info">' +
                        '<div class="name">' + item.item + '</div>' +
                        '<div class="meta">' + item.unit + (mode === 'take' ? ' &middot; ' + item.currentStock + ' on hand' : '') + '</div>' +
                        '</div>' +
                        '<div class="qty">' +
                        '<input type="number" min="1" class="qtyInput" value="' + item.quantity + '" data-idx="' + idx + '">' +
                        '<button type="button" class="remove" data-idx="' + idx + '" aria-label="Remove">&times;</button>' +
                        '</div>';
        list.appendChild(row);
      });
      // Wire quantity inputs
      list.querySelectorAll('.qtyInput').forEach(input => {
        input.addEventListener('change', (e) => {
          const idx = Number(e.target.dataset.idx);
          const val = Math.max(1, parseInt(e.target.value, 10) || 1);
          addedItems[idx].quantity = val;
          e.target.value = val;
        });
      });
      // Wire remove buttons
      list.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = Number(e.target.dataset.idx);
          addedItems.splice(idx, 1);
          renderAddedItems();
        });
      });
    }

    // Submit
    let submitting = false;
    document.getElementById('submit').addEventListener('click', async () => {
      if (submitting) return;
      const name = document.getElementById('name').value;
      const reason = document.getElementById('reason').value.trim();
      const err = document.getElementById('errBox');
      err.classList.remove('show');
      if (!name){ toast('Pick your name'); return; }
      if (addedItems.length === 0){ toast('Add at least one item'); return; }
      if (!reason){
        toast(mode === 'take' ? 'Enter where it is going' : 'Enter supplier or PO#');
        document.getElementById('reason').focus();
        return;
      }
      submitting = true;
      const btn = document.getElementById('submit');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = mode === 'take' ? 'Taking...' : 'Restocking...';
      const url = mode === 'take' ? TAKE_URL : RESTOCK_URL;
      const payload = {
        person: name,
        items: addedItems.map(i => ({ itemId: i.itemId, item: i.item, quantity: i.quantity })),
        reason: reason
      };
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.ok){
          if (data.error === 'unauthorized'){
            err.textContent = data.message || 'You are not authorized.';
            err.classList.add('show');
          } else {
            err.textContent = 'Something went wrong. Try again.';
            err.classList.add('show');
          }
          btn.disabled = false;
          btn.textContent = originalText;
          submitting = false;
          return;
        }
        // Success
        document.getElementById('doneTitle').textContent = mode === 'take' ? 'Supplies taken' : 'Restock recorded';
        const count = addedItems.length;
        document.getElementById('doneLine').textContent =
          count + ' item' + (count === 1 ? '' : 's') + ' ' + (mode === 'take' ? 'taken' : 'restocked') + '.';
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('doneScreen').classList.add('show');
      } catch(e) {
        err.textContent = 'No signal. Try again.';
        err.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = originalText;
      submitting = false;
    });

    // Do another
    document.getElementById('another').addEventListener('click', () => {
      addedItems = [];
      document.getElementById('name').selectedIndex = 0;
      document.getElementById('reason').value = '';
      renderAddedItems();
      document.getElementById('doneScreen').classList.remove('show');
      document.getElementById('mainForm').style.display = 'block';
    });

    // Init
    loadData();
    renderAddedItems();
  </script>
</body>
</html>
