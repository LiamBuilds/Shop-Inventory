<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --danger:#c0392b; --danger-press:#a02818;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:520px; width:100%; margin:0 auto; padding:24px 22px 28px;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .rule{height:6px; margin:0 0 26px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}
  h1{font-family:Georgia,serif; font-size:24px; margin:0 0 8px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 26px;}
  label{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  textarea{width:100%; appearance:none; background:var(--field); color:var(--paper);
    border:1.5px solid var(--line); border-radius:12px; padding:16px; font-size:16px; font-family:inherit;
    resize:vertical; min-height:120px;}
  textarea:focus{outline:none; border-color:var(--orange);}
  .hint{color:var(--muted); font-size:13px; margin-top:6px; line-height:1.4;}
  .btn{appearance:none; border:0; border-radius:14px; padding:18px; font-size:17px; font-weight:700; font-family:inherit;
    cursor:pointer; width:100%; margin-top:20px; transition:transform .06s, background .15s;}
  .btn.deny{background:var(--danger); color:#fff;}
  .btn.deny:active{transform:scale(.985); background:var(--danger-press);}
  .btn:disabled{opacity:.7; cursor:default;}
  .success{background:rgba(63,178,127,.14); border:1px solid rgba(63,178,127,.5); border-radius:12px; padding:20px; margin-top:20px; display:none;}
  .success.show{display:block;}
  .success h2{font-family:Georgia,serif; font-size:20px; margin:0 0 6px; color:var(--paper);}
  .success p{color:var(--muted); font-size:14px; margin:0;}
  .err{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:12px; padding:12px; margin-top:12px; font-size:14px; color:var(--paper); display:none;}
  .err.show{display:block;}
</style>
</head>

      <h1>Deny mitigation checkout</h1>
      <p class="sub">Enter a reason for the denial. The requester will get an email with this reason.</p>

      <label for="reason">Reason for denial</label>
      <textarea id="reason" placeholder="e.g. Equipment already committed to another job. Try again next week." autocomplete="off"></textarea>
      <div class="hint">Be brief and specific. The requester will see this exact text.</div>

      <button class="btn deny" id="submit">Send denial to requester</button>
      <div class="err" id="err"></div>
    </div>

    <div class="success" id="success">
      <h2>Denial sent</h2>
      <p>The requester has been notified with your reason. You can close this page.</p>
    </div>
  </main>

  <script>
    const DECISION_URL = "https://haggertybuilds.app.n8n.cloud/webhook/alice-decision";

    function getParam(name){
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }

    document.getElementById('submit').addEventListener('click', async () => {
      const reason = document.getElementById('reason').value.trim();
      const pending = getParam('pending');
      const err = document.getElementById('err');
      err.classList.remove('show');
      if (!pending) {
        err.textContent = 'Missing request ID in the link. Reload from the email.';
        err.classList.add('show');
        return;
      }
      if (!reason) {
        err.textContent = 'Please enter a reason before submitting.';
        err.classList.add('show');
        document.getElementById('reason').focus();
        return;
      }
      const btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        const url = DECISION_URL + '?action=deny&pending=' + encodeURIComponent(pending) + '&reason=' + encodeURIComponent(reason);
        const res = await fetch(url);
        if (!res.ok) throw new Error('bad response');
        document.getElementById('form').style.display = 'none';
        document.getElementById('success').classList.add('show');
      } catch(e) {
        err.textContent = 'Could not send. Try again or contact Liam.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Send denial to requester';
      }
    });
  </script>
</body>
</html>
