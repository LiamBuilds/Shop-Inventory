<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a;
    --orange:#F68922; --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --danger:#c0392b; --amber:#e6b422;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:1200px; margin:0 auto; padding:22px 28px 40px;}

  .top{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .userLabel{color:var(--muted); margin-left:auto; font-size:14px;}
  .userLabel b{color:var(--paper);}
  .rule{height:6px; margin:0 0 24px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}

  h1{font-family:Georgia,serif; font-size:28px; margin:0 0 4px;}
  .updated{color:var(--muted); font-size:13px; margin-bottom:24px;}

  .statsGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .stat .num{font-size:32px; font-weight:800; line-height:1.1;}
  .stat .label{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-top:4px;}
  .stat.alert .num{color:var(--danger);}
  .stat.warn .num{color:var(--amber);}
  .stat.ok .num{color:var(--green);}

  .section{margin-bottom:32px;}
  .section h2{font-family:Georgia,serif; font-size:20px; margin:0 0 12px;}
  .section h2 .count{color:var(--muted); font-weight:400; font-size:14px; margin-left:8px;}

  .empty{color:var(--muted); font-style:italic; padding:20px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:14px;}

  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  th{text-align:left; padding:12px 14px; background:rgba(0,0,0,.15); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line);}
  td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; color:var(--paper);}
  tr:last-child td{border-bottom:0;}
  tr.overdue td{background:rgba(200,60,60,.10);}
  tr.overdue td:first-child{border-left:3px solid var(--danger);}

  .badge{display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .b-shop{background:rgba(63,178,127,.20); color:#5ec99a;}
  .b-van{background:rgba(230,180,34,.20); color:var(--amber);}
  .b-site{background:rgba(246,137,34,.20); color:var(--orange);}
  .b-late{background:var(--danger); color:#fff;}
  .b-low{background:rgba(200,60,60,.20); color:#e08a80;}
  .b-ok{background:rgba(63,178,127,.20); color:#5ec99a;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:800px){ .grid2{grid-template-columns:1fr;} }

  .pendCard{background:linear-gradient(135deg, rgba(246,137,34,.15), rgba(246,137,34,.05)); border:1px solid rgba(246,137,34,.5); border-radius:12px; padding:18px; margin-bottom:12px;}
  .pendCard .pTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .pendCard .pName{font-size:17px; font-weight:700;}
  .pendCard .pDate{color:var(--muted); font-size:12px;}
  .pendCard .pItem{color:var(--paper); font-size:14px; margin-bottom:8px;}
  .pendCard .pJust{color:var(--muted); font-size:13px; font-style:italic; padding:8px 12px; background:rgba(0,0,0,.15); border-radius:8px;}

  .refreshInfo{color:var(--muted); font-size:12px; text-align:center; padding:20px 0;}
  .accessError{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:12px; padding:22px; text-align:center; color:var(--paper); font-size:15px;}
  .accessError a{color:var(--orange);}

  .loading{text-align:center; color:var(--muted); padding:60px 20px;}
</style>
</head>

      <span class="htitle" id="titleLabel">Dashboard</span>
      <span class="userLabel" id="userLabel"></span>
    </div>
    <div class="rule"></div>

    <div id="notAuth" class="accessError" style="display:none;">
      Access needed. Ask Liam for the correct link with your access code.
    </div>

    <div id="loading" class="loading">Loading dashboard...</div>

    <div id="content" style="display:none;">
      <h1 id="viewTitle"></h1>
      <div class="updated" id="updated"></div>

      <div class="statsGrid" id="statsGrid"></div>

      <div id="sections"></div>

      <div class="refreshInfo">Auto-refreshes every 5 minutes &middot; <a href="#" id="refreshNow" style="color:var(--orange);">Refresh now</a></div>
    </div>
  </main>

  <script>
    const DATA_URL = "https://haggertybuilds.app.n8n.cloud/webhook/dashboard-data";

    function getParam(name){
      const params = new URLSearchParams(window.location.search);
      return (params.get(name) || '').toLowerCase().trim();
    }

    const user = getParam('u');

    // Very light access gate - only "ahren" and "alice" pass
    if (user !== 'ahren' && user !== 'alice'){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notAuth').style.display = 'block';
    } else {
      document.getElementById('userLabel').innerHTML = 'Viewing as <b>' + user.charAt(0).toUpperCase() + user.slice(1) + '</b>';
      loadDashboard();
      // Auto-refresh every 5 minutes
      setInterval(loadDashboard, 5 * 60 * 1000);
    }

    document.getElementById('refreshNow').addEventListener('click', (e) => {
      e.preventDefault();
      loadDashboard();
    });

    async function loadDashboard(){
      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        const data = await res.json();
        render(data);
      } catch(e){
        document.getElementById('loading').textContent = 'Could not load data. Check your connection.';
      }
    }

    function render(data){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      const generated = new Date(data.generatedAt);
      document.getElementById('updated').textContent = 'Last updated: ' + generated.toLocaleTimeString() + ' on ' + generated.toLocaleDateString();

      if (user === 'ahren'){
        renderAhren(data);
      } else if (user === 'alice'){
        renderAlice(data);
      }
    }

    function renderAhren(data){
      document.getElementById('viewTitle').textContent = "Shop Overview";
      const s = data.stats;
      // Stats
      const statsGrid = document.getElementById('statsGrid');
      statsGrid.innerHTML =
        stat(s.totalOut, 'Items out', '') +
        stat(s.overdueCount, 'Overdue', s.overdueCount > 0 ? 'alert' : 'ok') +
        stat(s.uniquePeopleWithGear, 'People carrying gear', '') +
        stat(s.lowStockCount, 'Contents low', s.lowStockCount > 0 ? 'warn' : 'ok') +
        stat(s.pendingCount, 'Alice pending', s.pendingCount > 0 ? 'warn' : '');

      const sections = document.getElementById('sections');
      sections.innerHTML = '';

      // Overdue at top if any
      const overdue = (data.activeCheckouts || []).filter(c => c.isOverdue);
      if (overdue.length > 0){
        sections.appendChild(makeSection('Overdue items', overdue.length + ' late', renderOverdueTable(overdue)));
      }

      // Currently out by person
      const grouped = groupByPerson(data.activeCheckouts || []);
      if (Object.keys(grouped).length > 0){
        sections.appendChild(makeSection('Currently checked out', Object.keys(grouped).length + ' people', renderByPersonTable(grouped)));
      } else {
        sections.appendChild(makeSection('Currently checked out', '', emptyMsg('Nothing checked out.')));
      }

      // Recent activity
      const activity = buildRecentActivity(data);
      if (activity.length > 0){
        sections.appendChild(makeSection('Recent activity', 'last 24 hours', renderActivityTable(activity.slice(0, 15))));
      }

      // Low stock
      const low = (data.contents || []).filter(c => c.isLow);
      if (low.length > 0){
        sections.appendChild(makeSection('Contents low stock', low.length + ' items', renderLowStockTable(low)));
      }
    }

    function renderAlice(data){
      document.getElementById('viewTitle').textContent = "Mitigation Overview";
      const s = data.stats;
      statsGrid = document.getElementById('statsGrid');
      statsGrid.innerHTML =
        stat(s.pendingCount, 'Waiting approval', s.pendingCount > 0 ? 'alert' : 'ok') +
        stat(s.mitInField + ' / ' + s.mitTotal, 'Units in field', '') +
        stat(s.lowStockCount, 'Contents low', s.lowStockCount > 0 ? 'warn' : 'ok') +
        stat(s.totalOut, 'Total items out', '');

      const sections = document.getElementById('sections');
      sections.innerHTML = '';

      // Pending requests - top priority
      if ((data.pending || []).length > 0){
        const wrap = document.createElement('div');
        wrap.className = 'section';
        wrap.innerHTML = '<h2>Waiting for your approval <span class="count">' + data.pending.length + ' requests</span></h2>';
        data.pending.forEach(p => wrap.appendChild(renderPendingCard(p)));
        sections.appendChild(wrap);
      } else {
        sections.appendChild(makeSection('Approval requests', '', emptyMsg('No pending requests.')));
      }

      // Where mitigation equipment is
      if ((data.mitUnits || []).length > 0){
        sections.appendChild(makeSection('Mitigation equipment locations', data.mitUnits.length + ' units', renderMitUnitsTable(data.mitUnits)));
      }

      // Contents low stock
      const low = (data.contents || []).filter(c => c.isLow);
      if (low.length > 0){
        sections.appendChild(makeSection('Contents needing reorder', low.length + ' items', renderLowStockTable(low)));
      }

      // Recent mitigation activity
      if ((data.recentNFC || []).length > 0){
        sections.appendChild(makeSection('Recent mitigation activity', 'last 24 hours', renderNFCActivityTable(data.recentNFC.slice(0, 15))));
      }
    }

    // ===== HELPERS =====
    let statsGrid;

    function stat(num, label, style){
      return '<div class="stat ' + (style || '') + '"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
    }
    function makeSection(title, count, contentHtml){
      const div = document.createElement('div');
      div.className = 'section';
      const countLabel = count ? '<span class="count">' + count + '</span>' : '';
      div.innerHTML = '<h2>' + title + countLabel + '</h2>' + contentHtml;
      return div;
    }
    function emptyMsg(txt){
      return '<div class="empty">' + txt + '</div>';
    }

    function renderOverdueTable(items){
      const rows = items.map(i => {
        return '<tr class="overdue"><td><b>' + escape(i.item) + '</b></td><td>' + escape(i.person) + '</td><td>' + escape(i.destination || '-') + '</td><td>' + escape(i.dueBack) + '</td><td><span class="badge b-late">' + i.daysLate + ' day' + (i.daysLate === 1 ? '' : 's') + ' late</span></td></tr>';
      }).join('');
      return '<table><thead><tr><th>Item</th><th>Person</th><th>Where</th><th>Due back</th><th>Late</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function groupByPerson(items){
      const g = {};
      items.forEach(i => {
        if (!g[i.person]) g[i.person] = [];
        g[i.person].push(i);
      });
      return g;
    }
    function renderByPersonTable(grouped){
      let rows = '';
      Object.keys(grouped).sort().forEach(person => {
        const items = grouped[person];
        const itemList = items.map(i => escape(i.item) + (i.category ? ' <span style="color:#888; font-size:12px;">(' + escape(i.category) + ')</span>' : '')).join(', ');
        rows += '<tr><td><b>' + escape(person) + '</b> <span style="color:#888; font-size:12px;">(' + items.length + ')</span></td><td>' + itemList + '</td></tr>';
      });
      return '<table><thead><tr><th>Person</th><th>Items</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function buildRecentActivity(data){
      const events = [];
      (data.activeCheckouts || []).forEach(c => {
        if (c.checkOut){
          events.push({ ts: c.checkOut, type: 'Out', person: c.person, item: c.item, detail: c.destination });
        }
      });
      (data.recentReturns || []).forEach(r => {
        if (r.checkIn){
          events.push({ ts: r.checkIn, type: 'Returned', person: r.person, item: r.item, detail: '' });
        }
      });
      return events.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
    }
    function renderActivityTable(events){
      const rows = events.map(e => {
        const badge = e.type === 'Out'
          ? '<span class="badge b-site">Out</span>'
          : '<span class="badge b-ok">Returned</span>';
        return '<tr><td>' + escape(e.ts) + '</td><td>' + badge + '</td><td>' + escape(e.person) + '</td><td>' + escape(e.item) + '</td><td>' + escape(e.detail || '-') + '</td></tr>';
      }).join('');
      return '<table><thead><tr><th>When</th><th>Type</th><th>Person</th><th>Item</th><th>Where</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderLowStockTable(items){
      const rows = items.map(i => {
        return '<tr><td><b>' + escape(i.item) + '</b></td><td>' + i.quantity + ' ' + escape(i.unit) + '</td><td>' + i.threshold + '</td><td><span class="badge b-low">Below threshold</span></td></tr>';
      }).join('');
      return '<table><thead><tr><th>Item</th><th>On hand</th><th>Threshold</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderMitUnitsTable(units){
      const rows = units.map(u => {
        let locBadge;
        const type = (u.locationType || '').toLowerCase();
        if (type === 'shop') locBadge = '<span class="badge b-shop">Shop</span>';
        else if (type === 'van') locBadge = '<span class="badge b-van">Van</span>';
        else if (type === 'site') locBadge = '<span class="badge b-site">Site</span>';
        else locBadge = '<span class="badge b-shop">Shop</span>';
        return '<tr><td><b>' + escape(u.itemId) + '</b></td><td>' + escape(u.item || '-') + '</td><td>' + escape(u.category) + '</td><td>' + locBadge + ' ' + escape(u.location || '-') + '</td><td>' + escape(u.heldBy || '-') + '</td></tr>';
      }).join('');
      return '<table><thead><tr><th>ID</th><th>Item</th><th>Category</th><th>Where</th><th>Held by</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderNFCActivityTable(events){
      const rows = events.map(e => {
        const ts = new Date(e.timestamp);
        const tsLabel = ts.toLocaleString();
        return '<tr><td>' + escape(tsLabel) + '</td><td><b>' + escape(e.itemId) + '</b></td><td>' + escape(e.action) + '</td><td>' + escape(e.to) + '</td><td>' + escape(e.heldBy || '-') + '</td></tr>';
      }).join('');
      return '<table><thead><tr><th>When</th><th>Unit</th><th>Action</th><th>To</th><th>Held by</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderPendingCard(p){
      const card = document.createElement('div');
      card.className = 'pendCard';
      card.innerHTML = ''
        + '<div class="pTop"><div class="pName">' + escape(p.person) + '</div><div class="pDate">' + escape(p.requestedAt) + '</div></div>'
        + '<div class="pItem"><b>' + escape(p.item) + '</b> (' + escape(p.category) + ') to ' + escape(p.destination || 'unspecified') + '</div>'
        + '<div class="pJust"><b>Why they need it:</b> ' + escape(p.justification || '(no reason given)') + '</div>';
      return card;
    }

    function escape(str){
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
