<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a;
    --orange:#F68922; --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --danger:#c0392b; --amber:#e6b422;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:1200px; margin:0 auto; padding:22px 28px 40px;}

  .top{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .back{appearance:none; background:transparent; border:0; color:var(--paper); padding:6px; margin:-6px 6px -6px -6px; cursor:pointer; display:none;}
  .back.show{display:inline-flex;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .userLabel{color:var(--muted); margin-left:auto; font-size:14px;}
  .userLabel b{color:var(--paper);}
  .rule{height:6px; margin:0 0 24px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}

  h1{font-family:Georgia,serif; font-size:28px; margin:0 0 4px;}
  h2{font-family:Georgia,serif; font-size:20px; margin:0 0 12px;}
  h2 .count{color:var(--muted); font-weight:400; font-size:14px; margin-left:8px;}
  .updated{color:var(--muted); font-size:13px; margin-bottom:24px;}

  /* Landing tiles */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; margin-bottom:32px;}
  .tile{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:20px 22px; cursor:pointer; transition:transform .1s, border-color .15s; text-decoration:none; color:inherit; display:block;}
  .tile:hover{border-color:var(--orange);}
  .tile:active{transform:scale(.985);}
  .tile.hot{border-color:rgba(200,60,60,.5); background:linear-gradient(135deg, rgba(200,60,60,.14), rgba(200,60,60,.03));}
  .tile.warn{border-color:rgba(230,180,34,.5); background:linear-gradient(135deg, rgba(230,180,34,.10), rgba(230,180,34,.02));}
  .tileTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .tileIcon{width:38px; height:38px; background:var(--orange); color:var(--ink); border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .tileArrow{color:var(--muted);}
  .tileNum{font-size:38px; font-weight:800; line-height:1.1;}
  .tileLabel{color:var(--paper); font-weight:600; margin-top:4px;}
  .tileSub{color:var(--muted); font-size:12px; margin-top:2px;}
  .tile.hot .tileNum{color:var(--danger);}
  .tile.warn .tileNum{color:var(--amber);}

  /* Detail page: stats bar */
  .statsBar{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--line);}
  .miniStat{color:var(--muted); font-size:13px;}
  .miniStat b{color:var(--paper); font-weight:700; font-size:16px; margin-right:4px;}
  .miniStat.hot b{color:var(--danger);}

  /* Search + filter bar */
  .searchBar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; align-items:center;}
  .searchBar input{flex:1; min-width:220px; background:var(--card); color:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font-size:15px; font-family:inherit;}
  .searchBar input:focus{outline:none; border-color:var(--orange);}
  .chipRow{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{appearance:none; background:var(--card); border:1.5px solid var(--line); color:var(--paper); border-radius:8px; padding:8px 12px; font-size:13px; font-family:inherit; cursor:pointer; font-weight:600;}
  .chip.active{background:var(--orange); color:var(--ink); border-color:var(--orange);}

  /* Tables */
  .tableWrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:22px;}
  .tableWrap.scroll{max-height:500px; overflow-y:auto;}
  .tableWrap.scroll thead th{position:sticky; top:0; background:#2b2b2b; z-index:1;}
  .scrollHint{color:var(--muted); font-size:12px; text-align:right; margin-top:-16px; margin-bottom:22px; padding-right:6px;}
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; padding:12px 14px; background:rgba(0,0,0,.15); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; color:var(--paper);}
  tr:last-child td{border-bottom:0;}
  tr.overdue td:first-child{border-left:3px solid var(--danger);}
  tr.low td:first-child{border-left:3px solid var(--danger);}

  .catHeader{background:rgba(246,137,34,.10); border-top:1px solid rgba(246,137,34,.30);}
  .catHeader td{padding:12px 14px; color:var(--orange); font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;}

  .badge{display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
  .b-shop{background:rgba(63,178,127,.20); color:#5ec99a;}
  .b-van{background:rgba(230,180,34,.20); color:var(--amber);}
  .b-site{background:rgba(246,137,34,.20); color:var(--orange);}
  .b-late{background:var(--danger); color:#fff;}
  .b-low{background:rgba(200,60,60,.20); color:#e08a80;}
  .b-ok{background:rgba(63,178,127,.20); color:#5ec99a;}

  .empty{color:var(--muted); font-style:italic; padding:32px 20px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:14px;}
  .empty small{display:block; margin-top:6px; font-style:normal;}

  /* Pending approval card */
  .pendCard{background:linear-gradient(135deg, rgba(246,137,34,.15), rgba(246,137,34,.05)); border:1px solid rgba(246,137,34,.5); border-radius:12px; padding:18px; margin-bottom:14px;}
  .pendCard .pTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:6px;}
  .pendCard .pName{font-size:17px; font-weight:700;}
  .pendCard .pDate{color:var(--muted); font-size:12px;}
  .pendCard .pItem{color:var(--paper); font-size:14px; margin-bottom:8px;}
  .pendCard .pJust{color:var(--paper); font-size:13px; padding:10px 12px; background:rgba(0,0,0,.15); border-radius:8px; margin-bottom:14px;}
  .pendCard .pJust b{color:var(--muted); font-weight:600;}
  .pendCard .pActions{display:flex; flex-wrap:wrap; gap:10px;}
  .pendCard .pBtn{display:inline-block; padding:12px 22px; text-decoration:none; border-radius:8px; font-weight:700; font-size:14px;}
  .pendCard .pApprove{background:var(--green); color:#fff;}
  .pendCard .pDeny{background:var(--danger); color:#fff;}

  .accessError{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:12px; padding:22px; text-align:center; color:var(--paper); font-size:15px;}
  .loading{text-align:center; color:var(--muted); padding:60px 20px;}
  .refreshInfo{color:var(--muted); font-size:12px; text-align:center; padding:20px 0;}
  .refreshInfo a{color:var(--orange);}
</style>
</head>

      <span class="htitle" id="titleLabel">Dashboard</span>
      <span class="userLabel" id="userLabel"></span>
    </div>
    <div class="rule"></div>

    <div id="notAuth" class="accessError" style="display:none;">
      Access needed. Ask Liam for the correct link with your access code.
    </div>

    <div id="loading" class="loading">Loading dashboard...</div>

    <div id="content" style="display:none;">
      <h1 id="viewTitle"></h1>
      <div class="updated" id="updated"></div>
      <div id="body"></div>
      <div class="refreshInfo">Auto-refreshes every 5 minutes &middot; <a href="#" id="refreshNow">Refresh now</a></div>
    </div>
  </main>

  <script>
    const DATA_URL = "https://haggertybuilds.app.n8n.cloud/webhook/sb-dashboard-data";

    function getParam(name){
      const params = new URLSearchParams(window.location.search);
      return (params.get(name) || '').toLowerCase().trim();
    }

    const user = getParam('u');
    const view = getParam('view') || 'home';

    // Access gate
    if (user !== 'ahren' && user !== 'alice'){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notAuth').style.display = 'block';
    } else {
      document.getElementById('userLabel').innerHTML = 'Viewing as <b>' + user.charAt(0).toUpperCase() + user.slice(1) + '</b>';
      // Show back button on detail pages
      if (view !== 'home'){
        document.getElementById('backBtn').classList.add('show');
      }
      loadDashboard();
      setInterval(() => loadDashboardFresh(true), 5 * 60 * 1000);
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html?u=' + user;
    });
    document.getElementById('refreshNow').addEventListener('click', (e) => {
      e.preventDefault();
      // Manual refresh always fetches fresh (bypass cache)
      const l = document.getElementById('loading');
      const c = document.getElementById('content');
      if (l && c){
        // Show a subtle loading indicator on the refresh link
        const link = document.getElementById('refreshNow');
        const orig = link.textContent;
        link.textContent = 'Refreshing...';
        loadDashboardFresh(false).then(() => { link.textContent = orig; });
      }
    });

    let currentData = null;

    const CACHE_KEY = 'haggerty_dashboard_cache_v1';
    const CACHE_MINUTES = 5;

    function readCache(){
      try {
        const raw = sessionStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - (obj.t || 0) > CACHE_MINUTES * 60 * 1000) return null;
        return obj.d;
      } catch(e){ return null; }
    }
    function writeCache(data){
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: data }));
      } catch(e){}
    }

    async function loadDashboard(useCacheFirst){
      // If useCacheFirst is true (default), try cache first for instant render
      if (useCacheFirst !== false){
        const cached = readCache();
        if (cached){
          currentData = cached;
          render();
          // Also fire a background refresh so data stays fresh
          setTimeout(() => loadDashboardFresh(true), 100);
          return;
        }
      }
      await loadDashboardFresh(false);
    }

    async function loadDashboardFresh(silent){
      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        const data = await res.json();
        currentData = data;
        writeCache(data);
        // Only re-render if we're not doing a silent background refresh
        // OR if the loading screen is still showing (first load)
        if (!silent || document.getElementById('loading').style.display !== 'none'){
          render();
        } else {
          // Silent background refresh: update the "last updated" timestamp
          const generated = new Date(data.generatedAt);
          const el = document.getElementById('updated');
          if (el) el.textContent = 'Last updated ' + generated.toLocaleTimeString();
        }
      } catch(e){
        if (!silent){
          document.getElementById('loading').textContent = 'Could not load data. Check your connection.';
        }
      }
    }

    function render(){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      const generated = new Date(currentData.generatedAt);
      document.getElementById('updated').textContent = 'Last updated ' + generated.toLocaleTimeString();

      const body = document.getElementById('body');
      body.innerHTML = '';

      if (user === 'ahren'){
        renderAhren(body);
      } else if (user === 'alice'){
        renderAlice(body);
      }
    }

    // ===== ALICE VIEWS =====
    function renderAlice(body){
      if (view === 'home') return renderAliceHome(body);
      if (view === 'approvals') return renderApprovalsPage(body);
      if (view === 'equipment') return renderEquipmentPage(body);
      if (view === 'contents') return renderContentsPage(body);
      if (view === 'activity') return renderActivityPage(body);
      renderAliceHome(body);
    }

    function renderAliceHome(body){
      document.getElementById('viewTitle').textContent = 'Mitigation Overview';
      const s = currentData.stats;

      const tiles = document.createElement('div');
      tiles.className = 'tiles';

      tiles.innerHTML = ''
        + tile('approvals', 'Waiting for approval', s.pendingCount, s.pendingCount === 0 ? 'nothing pending' : (s.pendingCount + ' waiting on you'), s.pendingCount > 0 ? 'hot' : '', iconApprovals())
        + tile('equipment', 'Equipment', s.mitTotal, s.mitInField + ' currently in the field', '', iconEquipment())
        + tile('contents', 'Contents', currentData.contents.length, s.lowStockCount + ' low', s.lowStockCount > 0 ? 'warn' : '', iconContents())
        + tile('activity', 'Recent activity', currentData.recentNFC.length, 'last 24 hours', '', iconActivity());

      body.appendChild(tiles);
    }

    function renderApprovalsPage(body){
      document.getElementById('viewTitle').textContent = 'Waiting for Approval';
      if (currentData.pending.length === 0){
        body.innerHTML = '<div class="empty">No pending requests right now.<small>When someone requests mitigation gear without permission, they show up here.</small></div>';
        return;
      }
      const wrap = document.createElement('div');
      currentData.pending.forEach(p => wrap.appendChild(renderPendingCard(p)));
      body.appendChild(wrap);
    }

    function renderEquipmentPage(body){
      document.getElementById('viewTitle').textContent = 'Mitigation Equipment';
      const units = currentData.mitUnits || [];

      // Stats bar
      const s = currentData.stats;
      const stats = document.createElement('div');
      stats.className = 'statsBar';
      const shopCount = units.filter(u => (u.locationType || 'Shop').toLowerCase() === 'shop').length;
      const vanCount = units.filter(u => (u.locationType || '').toLowerCase() === 'van').length;
      const siteCount = units.filter(u => (u.locationType || '').toLowerCase() === 'site').length;
      stats.innerHTML = ''
        + '<div class="miniStat"><b>' + units.length + '</b> total units</div>'
        + '<div class="miniStat"><b>' + shopCount + '</b> at shop</div>'
        + '<div class="miniStat"><b>' + vanCount + '</b> in a van</div>'
        + '<div class="miniStat"><b>' + siteCount + '</b> at a site</div>';
      body.appendChild(stats);

      if (units.length === 0){
        body.appendChild(fromHtml('<div class="empty">No mitigation equipment in the system yet.<small>Add items to the Dehumidifiers, Air Movers, and Scrubbers AFD tabs in Excel.</small></div>'));
        return;
      }

      // Filter bar
      const filterState = { search: '', category: 'all', location: 'all' };
      const searchBar = document.createElement('div');
      searchBar.className = 'searchBar';
      searchBar.innerHTML = ''
        + '<input id="eqSearch" type="text" placeholder="Search by ID or name..." autocomplete="off">'
        + '<div class="chipRow" id="eqLoc"></div>'
        + '<div class="chipRow" id="eqCat"></div>';
      body.appendChild(searchBar);

      const locations = ['all', 'Shop', 'Van', 'Site'];
      const categories = ['all', ...Array.from(new Set(units.map(u => u.category).filter(Boolean)))];

      const locChip = document.getElementById('eqLoc');
      locations.forEach(loc => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (loc === filterState.location ? ' active' : '');
        btn.textContent = loc === 'all' ? 'All locations' : loc;
        btn.addEventListener('click', () => { filterState.location = loc; refreshEquipment(); });
        locChip.appendChild(btn);
      });
      const catChip = document.getElementById('eqCat');
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (cat === filterState.category ? ' active' : '');
        btn.textContent = cat === 'all' ? 'All types' : cat;
        btn.addEventListener('click', () => { filterState.category = cat; refreshEquipment(); });
        catChip.appendChild(btn);
      });
      document.getElementById('eqSearch').addEventListener('input', (e) => { filterState.search = e.target.value.trim().toLowerCase(); refreshEquipment(); });

      // Table container
      const tableWrap = document.createElement('div');
      tableWrap.id = 'eqTable';
      body.appendChild(tableWrap);

      function refreshEquipment(){
        // Update active chip state
        document.querySelectorAll('#eqLoc .chip').forEach(c => c.classList.toggle('active', c.textContent === (filterState.location === 'all' ? 'All locations' : filterState.location)));
        document.querySelectorAll('#eqCat .chip').forEach(c => c.classList.toggle('active', c.textContent === (filterState.category === 'all' ? 'All types' : filterState.category)));

        let filtered = units;
        if (filterState.location !== 'all') filtered = filtered.filter(u => (u.locationType || 'Shop') === filterState.location);
        if (filterState.category !== 'all') filtered = filtered.filter(u => u.category === filterState.category);
        if (filterState.search) filtered = filtered.filter(u => (u.itemId + ' ' + u.item).toLowerCase().includes(filterState.search));

        if (filtered.length === 0){
          document.getElementById('eqTable').innerHTML = '<div class="empty">No units match your filters.</div>';
          return;
        }
        const rows = filtered.map(u => {
          const type = (u.locationType || '').toLowerCase();
          let badge;
          if (type === 'shop' || !type) badge = '<span class="badge b-shop">Shop</span>';
          else if (type === 'van') badge = '<span class="badge b-van">Van</span>';
          else if (type === 'site') badge = '<span class="badge b-site">Site</span>';
          else badge = '<span class="badge b-shop">' + esc(u.locationType) + '</span>';
          return '<tr><td><b>' + esc(u.itemId) + '</b></td><td>' + esc(u.item || '-') + '</td><td>' + esc(u.category) + '</td><td>' + badge + ' ' + esc(u.location || '-') + '</td><td>' + esc(u.heldBy || '-') + '</td></tr>';
        }).join('');
        const eqScrollClass = filtered.length > 12 ? ' scroll' : '';
        const eqScrollHint = filtered.length > 12 ? '<div class="scrollHint">Scroll to see more &darr;</div>' : '';
        document.getElementById('eqTable').innerHTML = '<div class="tableWrap' + eqScrollClass + '"><table><thead><tr><th>ID</th><th>Item</th><th>Category</th><th>Where</th><th>Held by</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + eqScrollHint;
      }
      refreshEquipment();
    }

    function renderContentsPage(body){
      document.getElementById('viewTitle').textContent = 'Contents Inventory';
      const items = currentData.contents || [];

      // Stats bar
      const stats = document.createElement('div');
      stats.className = 'statsBar';
      const lowCount = items.filter(c => c.isLow).length;
      stats.innerHTML = ''
        + '<div class="miniStat"><b>' + items.length + '</b> items tracked</div>'
        + '<div class="miniStat ' + (lowCount > 0 ? 'hot' : '') + '"><b>' + lowCount + '</b> below threshold</div>';
      body.appendChild(stats);

      if (items.length === 0){
        body.appendChild(fromHtml('<div class="empty">No contents in the system yet.<small>Add items to the Contents tab in Excel with a name, quantity, and reorder threshold.</small></div>'));
        return;
      }

      // Filter bar
      const filterState = { search: '', category: 'all', lowOnly: false };
      const searchBar = document.createElement('div');
      searchBar.className = 'searchBar';
      searchBar.innerHTML = ''
        + '<input id="ctSearch" type="text" placeholder="Search items..." autocomplete="off">'
        + '<div class="chipRow" id="ctFilters"></div>';
      body.appendChild(searchBar);

      const categories = Array.from(new Set(items.map(c => c.category).filter(Boolean)));
      const chipRow = document.getElementById('ctFilters');
      // "All" + "Low only" + each category
      const btnAll = chipBtn('All', () => { filterState.category = 'all'; filterState.lowOnly = false; refreshContents(); });
      const btnLow = chipBtn('Low only', () => { filterState.lowOnly = !filterState.lowOnly; refreshContents(); });
      chipRow.appendChild(btnAll);
      chipRow.appendChild(btnLow);
      categories.forEach(cat => {
        chipRow.appendChild(chipBtn(cat, () => { filterState.category = cat; refreshContents(); }));
      });

      document.getElementById('ctSearch').addEventListener('input', (e) => { filterState.search = e.target.value.trim().toLowerCase(); refreshContents(); });

      const container = document.createElement('div');
      container.id = 'ctBody';
      body.appendChild(container);

      function refreshContents(){
        document.querySelectorAll('#ctFilters .chip').forEach(c => {
          const label = c.textContent;
          if (label === 'All') c.classList.toggle('active', filterState.category === 'all' && !filterState.lowOnly);
          else if (label === 'Low only') c.classList.toggle('active', filterState.lowOnly);
          else c.classList.toggle('active', label === filterState.category);
        });

        let filtered = items;
        if (filterState.lowOnly) filtered = filtered.filter(c => c.isLow);
        if (filterState.category !== 'all') filtered = filtered.filter(c => c.category === filterState.category);
        if (filterState.search) filtered = filtered.filter(c => c.item.toLowerCase().includes(filterState.search));

        if (filtered.length === 0){
          document.getElementById('ctBody').innerHTML = '<div class="empty">No items match your filters.</div>';
          return;
        }

        // Group by category if any items have one
        const hasCategories = filtered.some(c => c.category);
        let html = '<div class="tableWrap"><table><thead><tr><th>Item</th><th>On hand</th><th>Threshold</th><th>Status</th></tr></thead><tbody>';

        if (hasCategories){
          const byCategory = {};
          filtered.forEach(c => {
            const cat = c.category || 'Uncategorized';
            if (!byCategory[cat]) byCategory[cat] = [];
            byCategory[cat].push(c);
          });
          Object.keys(byCategory).sort().forEach(cat => {
            const catItems = byCategory[cat];
            const catLow = catItems.filter(c => c.isLow).length;
            html += '<tr class="catHeader"><td colspan="4">' + esc(cat) + ' <span style="color:var(--muted); font-weight:400; text-transform:none;">' + catItems.length + ' item' + (catItems.length === 1 ? '' : 's') + (catLow > 0 ? ', ' + catLow + ' low' : '') + '</span></td></tr>';
            catItems.forEach(c => { html += contentRow(c); });
          });
        } else {
          filtered.forEach(c => { html += contentRow(c); });
        }
        html += '</tbody></table></div>';
        // Convert to scrollable if many rows
        if (filtered.length > 12){
          html = html.replace('<div class="tableWrap">', '<div class="tableWrap scroll">');
          html += '<div class="scrollHint">Scroll to see more &darr;</div>';
        }
        document.getElementById('ctBody').innerHTML = html;
      }

      function contentRow(c){
        const status = c.isLow ? '<span class="badge b-low">Reorder</span>' : '<span class="badge b-ok">OK</span>';
        const cls = c.isLow ? ' class="low"' : '';
        return '<tr' + cls + '><td><b>' + esc(c.item) + '</b></td><td>' + c.quantity + ' ' + esc(c.unit || '') + '</td><td>' + c.threshold + '</td><td>' + status + '</td></tr>';
      }

      refreshContents();
    }

    function renderActivityPage(body){
      document.getElementById('viewTitle').textContent = 'Recent Mitigation Activity';
      const events = currentData.recentNFC || [];
      if (events.length === 0){
        body.appendChild(fromHtml('<div class="empty">No recent activity in the last 24 hours.<small>When someone taps an NFC tag or checks out mitigation gear, it shows up here.</small></div>'));
        return;
      }
      const stats = document.createElement('div');
      stats.className = 'statsBar';
      stats.innerHTML = '<div class="miniStat"><b>' + events.length + '</b> events in last 24 hours</div>';
      body.appendChild(stats);

      const rows = events.map(e => {
        const ts = new Date(e.timestamp);
        return '<tr><td>' + esc(ts.toLocaleString()) + '</td><td><b>' + esc(e.itemId) + '</b></td><td>' + esc(e.item || '-') + '</td><td>' + esc(e.action) + '</td><td>' + esc(e.from || '-') + ' &rarr; ' + esc(e.to || '-') + '</td><td>' + esc(e.heldBy || '-') + '</td></tr>';
      }).join('');
      const aliceActivityScrollClass = events.length > 12 ? ' scroll' : '';
      body.appendChild(fromHtml('<div class="tableWrap' + aliceActivityScrollClass + '"><table><thead><tr><th>When</th><th>Unit</th><th>Item</th><th>Action</th><th>Movement</th><th>Held by</th></tr></thead><tbody>' + rows + '</tbody></table></div>'));
      if (events.length > 12) body.appendChild(fromHtml('<div class="scrollHint">Scroll to see more &darr;</div>'));
    }

    // ===== AHREN VIEWS =====
    function renderAhren(body){
      if (view === 'home') return renderAhrenHome(body);
      if (view === 'checkouts') return renderAhrenCheckouts(body);
      if (view === 'overdue') return renderAhrenOverdue(body);
      if (view === 'activity') return renderAhrenActivity(body);
      renderAhrenHome(body);
    }

    function renderAhrenHome(body){
      document.getElementById('viewTitle').textContent = 'Shop Overview';
      const s = currentData.stats;

      const tiles = document.createElement('div');
      tiles.className = 'tiles';
      tiles.innerHTML = ''
        + tile('checkouts', 'Checked out', s.totalOut, s.uniquePeopleWithGear + ' people', '', iconEquipment())
        + tile('overdue', 'Overdue', s.overdueCount, s.overdueCount === 0 ? 'none' : (s.overdueCount + ' late'), s.overdueCount > 0 ? 'hot' : '', iconLate())
        + tile('activity', 'Activity', (currentData.recentReturns.length + currentData.activeCheckouts.filter(c => c.checkOut).length), 'last 24h', '', iconActivity());
      body.appendChild(tiles);
    }

    function renderAhrenCheckouts(body){
      document.getElementById('viewTitle').textContent = 'All Active Checkouts';
      const items = currentData.activeCheckouts || [];

      // Stats bar
      const stats = document.createElement('div');
      stats.className = 'statsBar';
      const overdueCount = items.filter(c => c.isOverdue).length;
      const uniquePeople = [...new Set(items.map(c => c.person))].length;
      stats.innerHTML = ''
        + '<div class="miniStat"><b>' + items.length + '</b> items out</div>'
        + '<div class="miniStat"><b>' + uniquePeople + '</b> people</div>'
        + '<div class="miniStat ' + (overdueCount > 0 ? 'hot' : '') + '"><b>' + overdueCount + '</b> overdue</div>';
      body.appendChild(stats);

      if (items.length === 0){
        body.appendChild(fromHtml('<div class="empty">Nothing is checked out right now.<small>When crew members check out tools through the app, they show up here.</small></div>'));
        return;
      }

      // Filter bar
      const filterState = { search: '', category: 'all', overdueOnly: false };
      const searchBar = document.createElement('div');
      searchBar.className = 'searchBar';
      searchBar.innerHTML = ''
        + '<input id="coSearch" type="text" placeholder="Search by person or item..." autocomplete="off">'
        + '<div class="chipRow" id="coFilters"></div>';
      body.appendChild(searchBar);

      const categories = Array.from(new Set(items.map(c => c.category).filter(Boolean)));
      const chipRow = document.getElementById('coFilters');
      chipRow.appendChild(chipBtn('All', () => { filterState.category = 'all'; filterState.overdueOnly = false; refreshCheckouts(); }));
      chipRow.appendChild(chipBtn('Overdue only', () => { filterState.overdueOnly = !filterState.overdueOnly; refreshCheckouts(); }));
      categories.forEach(cat => {
        chipRow.appendChild(chipBtn(cat, () => { filterState.category = cat; refreshCheckouts(); }));
      });

      document.getElementById('coSearch').addEventListener('input', (e) => { filterState.search = e.target.value.trim().toLowerCase(); refreshCheckouts(); });

      const container = document.createElement('div');
      container.id = 'coBody';
      body.appendChild(container);

      function refreshCheckouts(){
        document.querySelectorAll('#coFilters .chip').forEach(c => {
          const label = c.textContent;
          if (label === 'All') c.classList.toggle('active', filterState.category === 'all' && !filterState.overdueOnly);
          else if (label === 'Overdue only') c.classList.toggle('active', filterState.overdueOnly);
          else c.classList.toggle('active', label === filterState.category);
        });

        let filtered = items;
        if (filterState.overdueOnly) filtered = filtered.filter(c => c.isOverdue);
        if (filterState.category !== 'all') filtered = filtered.filter(c => c.category === filterState.category);
        if (filterState.search){
          const q = filterState.search;
          filtered = filtered.filter(c => (c.person + ' ' + c.item + ' ' + c.destination).toLowerCase().includes(q));
        }

        if (filtered.length === 0){
          document.getElementById('coBody').innerHTML = '<div class="empty">No checkouts match your filters.</div>';
          return;
        }

        const rows = filtered.map(c => {
          const statusBadge = c.isOverdue
            ? '<span class="badge b-late">' + c.daysLate + ' day' + (c.daysLate === 1 ? '' : 's') + ' late</span>'
            : '<span class="badge b-ok">On time</span>';
          const cls = c.isOverdue ? ' class="overdue"' : '';
          return '<tr' + cls + '><td><b>' + esc(c.person) + '</b></td><td>' + esc(c.item) + '</td><td>' + esc(c.category) + '</td><td>' + esc(c.destination || '-') + '</td><td>' + esc(c.checkOut) + '</td><td>' + esc(c.dueBack) + '</td><td>' + statusBadge + '</td></tr>';
        }).join('');

        const scrollClass = filtered.length > 12 ? ' scroll' : '';
        const scrollHint = filtered.length > 12 ? '<div class="scrollHint">Scroll to see more &darr;</div>' : '';
        document.getElementById('coBody').innerHTML = '<div class="tableWrap' + scrollClass + '"><table><thead><tr><th>Person</th><th>Item</th><th>Category</th><th>Where</th><th>Checked out</th><th>Due back</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + scrollHint;
      }
      refreshCheckouts();
    }

    function renderAhrenOverdue(body){
      document.getElementById('viewTitle').textContent = 'Overdue Items';
      const overdue = (currentData.activeCheckouts || []).filter(c => c.isOverdue);

      if (overdue.length === 0){
        body.appendChild(fromHtml('<div class="empty" style="border-color:rgba(63,178,127,.5); background:rgba(63,178,127,.08);">Nothing is overdue right now.<small>All checked-out items are within their due-back window.</small></div>'));
        return;
      }

      // Stats bar
      const stats = document.createElement('div');
      stats.className = 'statsBar';
      const uniquePeople = [...new Set(overdue.map(c => c.person))].length;
      const maxLate = Math.max(...overdue.map(c => c.daysLate));
      stats.innerHTML = ''
        + '<div class="miniStat hot"><b>' + overdue.length + '</b> items overdue</div>'
        + '<div class="miniStat"><b>' + uniquePeople + '</b> people</div>'
        + '<div class="miniStat"><b>' + maxLate + '</b> days (longest overdue)</div>';
      body.appendChild(stats);

      // Group by person
      const grouped = {};
      overdue.forEach(c => {
        if (!grouped[c.person]) grouped[c.person] = [];
        grouped[c.person].push(c);
      });

      const sortedPeople = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length);
      let html = '<div class="tableWrap"><table><thead><tr><th>Person</th><th>Item</th><th>Category</th><th>Where</th><th>Due back</th><th>Late</th></tr></thead><tbody>';
      sortedPeople.forEach(person => {
        const items = grouped[person];
        items.forEach((c, idx) => {
          const personCell = idx === 0
            ? '<b>' + esc(person) + '</b> <span style="color:var(--muted); font-weight:400; font-size:12px;">(' + items.length + ')</span>'
            : '';
          html += '<tr class="overdue"><td>' + personCell + '</td><td>' + esc(c.item) + '</td><td>' + esc(c.category) + '</td><td>' + esc(c.destination || '-') + '</td><td>' + esc(c.dueBack) + '</td><td><span class="badge b-late">' + c.daysLate + ' day' + (c.daysLate === 1 ? '' : 's') + '</span></td></tr>';
        });
      });
      html += '</tbody></table></div>';
      // Replace the opening tableWrap div with the scrollable class if many rows
      if (overdue.length > 12){
        html = html.replace('<div class="tableWrap">', '<div class="tableWrap scroll">');
      }
      body.appendChild(fromHtml(html));
      if (overdue.length > 12){
        body.appendChild(fromHtml('<div class="scrollHint">Scroll to see more &darr;</div>'));
      }
    }

    function renderAhrenActivity(body){
      document.getElementById('viewTitle').textContent = 'Recent Shop Activity';

      // Combine checkouts + returns from last 24h
      const events = [];
      (currentData.activeCheckouts || []).forEach(c => {
        if (c.checkOut){
          events.push({ ts: c.checkOut, type: 'Out', person: c.person, item: c.item, category: c.category, detail: c.destination || '' });
        }
      });
      (currentData.recentReturns || []).forEach(r => {
        if (r.checkIn){
          events.push({ ts: r.checkIn, type: 'Returned', person: r.person, item: r.item, category: r.category, detail: '' });
        }
      });
      events.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));

      if (events.length === 0){
        body.appendChild(fromHtml('<div class="empty">No recent activity in the last 24 hours.<small>When crew members check out or return tools, they show up here.</small></div>'));
        return;
      }

      const stats = document.createElement('div');
      stats.className = 'statsBar';
      const outs = events.filter(e => e.type === 'Out').length;
      const returns = events.filter(e => e.type === 'Returned').length;
      stats.innerHTML = ''
        + '<div class="miniStat"><b>' + events.length + '</b> total events</div>'
        + '<div class="miniStat"><b>' + outs + '</b> checkouts</div>'
        + '<div class="miniStat"><b>' + returns + '</b> returns</div>';
      body.appendChild(stats);

      const rows = events.map(e => {
        const badge = e.type === 'Out'
          ? '<span class="badge b-site">Out</span>'
          : '<span class="badge b-ok">Returned</span>';
        return '<tr><td>' + esc(e.ts) + '</td><td>' + badge + '</td><td><b>' + esc(e.person) + '</b></td><td>' + esc(e.item) + '</td><td>' + esc(e.category || '-') + '</td><td>' + esc(e.detail || '-') + '</td></tr>';
      }).join('');

      const activityScrollClass = events.length > 12 ? ' scroll' : '';
      body.appendChild(fromHtml('<div class="tableWrap' + activityScrollClass + '"><table><thead><tr><th>When</th><th>Type</th><th>Person</th><th>Item</th><th>Category</th><th>Where</th></tr></thead><tbody>' + rows + '</tbody></table></div>'));
      if (events.length > 12) body.appendChild(fromHtml('<div class="scrollHint">Scroll to see more &darr;</div>'));
    }

    // ===== HELPERS =====
    function tile(viewName, label, num, sub, style, iconSvg){
      const href = 'dashboard.html?u=' + user + '&view=' + viewName;
      return '<a class="tile ' + (style || '') + '" href="' + href + '">'
        + '<div class="tileTop">'
        + '<div class="tileIcon">' + iconSvg + '</div>'
        + '<div class="tileArrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>'
        + '</div>'
        + '<div class="tileNum">' + num + '</div>'
        + '<div class="tileLabel">' + label + '</div>'
        + '<div class="tileSub">' + sub + '</div>'
        + '</a>';
    }

    function iconApprovals(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>'; }
    function iconEquipment(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>'; }
    function iconContents(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7L12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg>'; }
    function iconActivity(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>'; }
    function iconLate(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }

    function fromHtml(str){
      const div = document.createElement('div');
      div.innerHTML = str;
      return div.firstElementChild;
    }

    function chipBtn(label, onClick){
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = label;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function renderPendingCard(p){
      const card = document.createElement('div');
      card.className = 'pendCard';
      const approveUrl = 'https://haggertybuilds.app.n8n.cloud/webhook/alice-decision?pending=' + encodeURIComponent(p.pendingId) + '&action=approve';
      const denyUrl = 'https://liambuilds.github.io/Shop-Inventory/deny.html?pending=' + encodeURIComponent(p.pendingId);
      card.innerHTML = ''
        + '<div class="pTop"><div class="pName">' + esc(p.person) + '</div><div class="pDate">' + esc(p.requestedAt) + '</div></div>'
        + '<div class="pItem"><b>' + esc(p.item) + '</b> (' + esc(p.category) + ')' + (p.destination ? ' to ' + esc(p.destination) : '') + '</div>'
        + '<div class="pJust"><b>Why they need it:</b> ' + esc(p.justification || '(no reason given)') + '</div>'
        + '<div class="pActions">'
        + '<a class="pBtn pApprove" href="' + approveUrl + '">Approve</a>'
        + '<a class="pBtn pDeny" href="' + denyUrl + '">Deny (with reason)</a>'
        + '</div>';
      return card;
    }

    function esc(str){
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
