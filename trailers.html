<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --orange-press:#d9760f;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --danger:#c0392b; --amber:#e6b422;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:900px; width:100%; margin:0 auto; padding:20px 22px 28px;}

  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back{appearance:none; background:none; border:0; padding:8px; margin:-8px 0 -8px -8px; cursor:pointer; color:var(--paper); text-decoration:none; display:flex;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .rule{height:6px; margin:0 0 24px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}

  h1{font-family:Georgia,serif; font-size:26px; margin:0 0 20px;}
  h2{font-family:Georgia,serif; font-size:18px; margin:24px 0 12px;}

  .toolbar{display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;}
  .reserveBtn{flex:1; min-width:200px; appearance:none; border:0; background:var(--orange); color:var(--ink);
    padding:16px 20px; border-radius:12px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer;}
  .reserveBtn:active{background:var(--orange-press);}
  .weekNav{display:flex; align-items:center; gap:8px;}
  .weekBtn{appearance:none; background:var(--card); border:1.5px solid var(--line); color:var(--paper);
    padding:12px 14px; border-radius:10px; font-family:inherit; cursor:pointer; font-size:14px;}
  .weekLabel{color:var(--muted); font-size:13px; padding:0 6px;}

  /* Calendar */
  .calendar{background:var(--card); border:1.5px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:32px;}
  .calGrid{display:grid; grid-template-columns:120px repeat(7, 1fr); gap:0; min-width:700px;}
  .calCell{padding:10px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); font-size:12px;}
  .calCell:last-child, .calGrid > .calCell:nth-child(8n){border-right:0;}
  .calHeader{background:rgba(0,0,0,.15); color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; text-align:center;}
  .calHeader.today{background:rgba(246,137,34,.15); color:var(--orange);}
  .calLabel{color:var(--paper); font-weight:700; font-size:14px; background:rgba(0,0,0,.1);}
  .calSlot{position:relative; min-height:56px; background:var(--card);}
  .calBooking{position:absolute; top:4px; left:4px; right:4px; bottom:4px; background:var(--orange); color:var(--ink);
    border-radius:6px; padding:6px 8px; font-size:11px; font-weight:600; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center;}
  .calBooking:active{opacity:.85;}
  .calBooking.active{background:var(--green); color:#fff;}
  .calBooking .bkPerson{font-weight:700;}
  .calBooking .bkTime{font-size:10px; opacity:.85;}
  .calScrollWrap{overflow-x:auto;}

  /* List */
  .listItem{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px;}
  .listItem .li-left{flex:1; min-width:0;}
  .listItem .li-trailer{font-size:15px; font-weight:700; color:var(--paper);}
  .listItem .li-person{color:var(--muted); font-size:13px; margin-top:2px;}
  .listItem .li-time{color:var(--paper); font-size:13px; margin-top:6px;}
  .listItem .li-dest{color:var(--muted); font-size:12px; margin-top:2px;}
  .listItem .li-status{flex-shrink:0;}
  .badge{display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .b-reserved{background:rgba(246,137,34,.20); color:var(--orange);}
  .b-active{background:rgba(63,178,127,.20); color:#5ec99a;}
  .b-completed{background:rgba(154,154,154,.20); color:var(--muted);}
  .b-cancelled{background:rgba(200,60,60,.20); color:#e08a80;}

  .empty{color:var(--muted); font-style:italic; padding:30px 20px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:14px;}
  .loading{text-align:center; padding:40px 20px; color:var(--muted);}

  /* Reserve modal */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:80; display:none; align-items:flex-end; justify-content:center;}
  .modal.show{display:flex;}
  .modalSheet{background:var(--bg); width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:22px 22px calc(28px + env(safe-area-inset-bottom)); max-height:90vh; overflow-y:auto;}
  .modalTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modalTitle{font-family:Georgia,serif; font-size:20px;}
  .modalClose{appearance:none; background:transparent; border:0; color:var(--muted); cursor:pointer; padding:4px;}
  .field{margin-bottom:16px;}
  label{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
  select, input, textarea{width:100%; appearance:none; background:var(--field); color:var(--paper);
    border:1.5px solid var(--line); border-radius:10px; padding:14px; font-size:15px; font-family:inherit;}
  textarea{resize:vertical; min-height:60px;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%239a9a9a' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; padding-right:42px;}
  select:focus, input:focus, textarea:focus{outline:none; border-color:var(--orange);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .req{color:var(--orange); font-weight:700; margin-left:2px;}
  .submit{appearance:none; border:0; border-radius:14px; padding:18px; font-size:17px; font-weight:700; font-family:inherit;
    background:var(--orange); color:var(--ink); cursor:pointer; width:100%; margin-top:10px;}
  .submit:disabled{opacity:.7;}
  .errBox{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:10px; padding:12px 14px; margin-bottom:14px; color:var(--paper); font-size:14px; display:none;}
  .errBox.show{display:block;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--orange); color:var(--ink); font-weight:700; padding:12px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:.25s; font-size:14px; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Detail modal */
  .detailInfo{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px;}
  .detailRow{display:flex; justify-content:space-between; padding:6px 0; font-size:14px;}
  .detailRow .k{color:var(--muted);}
  .detailRow .v{color:var(--paper); font-weight:600; text-align:right;}
  .detailActions{display:flex; gap:8px;}
  .actBtn{flex:1; appearance:none; border:0; padding:14px; border-radius:10px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;}
  .actComplete{background:var(--green); color:#fff;}
  .actCancel{background:var(--danger); color:#fff;}
</style>
</head>

      <span class="htitle">Trailers</span>
    </div>
    <div class="rule"></div>

    <div id="loading" class="loading">Loading reservations...</div>

    <div id="main" style="display:none;">
      <h1>Trailer Reservations</h1>

      <div class="toolbar">
        <button class="reserveBtn" id="reserveBtn">+ Reserve a trailer</button>
        <div class="weekNav">
          <button class="weekBtn" id="prevWeek">&larr;</button>

          <button class="weekBtn" id="nextWeek">&rarr;</button>

      <div class="calScrollWrap">
        <div class="calendar" id="calendar"></div>
      </div>

      <h2>Upcoming reservations</h2>
      <div id="upcomingList"></div>

      <h2>Currently active</h2>
      <div id="activeList"></div>
    </div>

  <!-- Reserve modal -->
  <div class="modal" id="reserveModal">
    <div class="modalSheet">
      <div class="modalTop">
        <div class="modalTitle">Reserve a trailer</div>
        <button class="modalClose" id="reserveClose">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="errBox" id="errBox"></div>

      <div class="field">
        <label for="trailerSel">Trailer <span class="req">*</span></label>
        <select id="trailerSel">
          <option value="" selected disabled>Pick a trailer</option>
          <option value="Lowboy">Lowboy</option>
          <option value="Large Dump">Large Dump</option>
          <option value="Small Dump">Small Dump</option>
        </select>
      </div>

      <div class="field">
        <label for="personSel">Your name <span class="req">*</span></label>
        <select id="personSel">
          <option value="" selected disabled>Loading names...</option>
        </select>
      </div>

      <div class="row2">
        <div class="field">
          <label for="startInput">Start <span class="req">*</span></label>
          <input id="startInput" type="datetime-local">
        </div>
        <div class="field">
          <label for="endInput">End <span class="req">*</span></label>
          <input id="endInput" type="datetime-local">
        </div>
      </div>

      <div class="field">
        <label for="destInput">Destination <span class="req">*</span></label>
        <input id="destInput" type="text" placeholder="Where is it going?" autocomplete="off">
      </div>

      <div class="field">
        <label for="notesInput">Notes (optional)</label>
        <textarea id="notesInput" rows="2" autocomplete="off"></textarea>
      </div>

      <button class="submit" id="submitReserve">Reserve</button>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal" id="detailModal">
    <div class="modalSheet">
      <div class="modalTop">
        <div class="modalTitle" id="detailTitle">Reservation</div>
        <button class="modalClose" id="detailClose">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="detailInfo" id="detailInfo"></div>
      <div class="detailActions" id="detailActions"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DATA_URL = "https://haggertybuilds.app.n8n.cloud/webhook/trailer-data";
    const RESERVE_URL = "https://haggertybuilds.app.n8n.cloud/webhook/trailer-reserve";
    const COMPLETE_URL = "https://haggertybuilds.app.n8n.cloud/webhook/trailer-complete";

    const TRAILERS = ['Lowboy', 'Large Dump', 'Small Dump'];
    let currentData = null;
    let weekOffset = 0; // 0 = this week, +1 = next week, -1 = last week
    let t;

    function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(t); t=setTimeout(()=>el.classList.remove('show'),2200); }

    // Get start of the week (Monday) for the current + offset
    function getWeekStart(offset){
      const d = new Date();
      const dayOfWeek = (d.getDay() + 6) % 7; // Monday = 0
      d.setDate(d.getDate() - dayOfWeek + offset * 7);
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function fmtDay(d){
      return d.toLocaleDateString('en-US', { weekday:'short', month:'numeric', day:'numeric' });
    }
    function fmtDayShort(d){
      return d.toLocaleDateString('en-US', { month:'numeric', day:'numeric' });
    }

    async function loadData(){
      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        const data = await res.json();
        currentData = data;
        renderMain();
      } catch(e){
        document.getElementById('loading').textContent = 'Could not load data. Check your connection.';
      }
    }

    function renderMain(){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = 'block';

      // Populate name dropdown
      const sel = document.getElementById('personSel');
      sel.innerHTML = '<option value="" selected disabled>Pick your name</option>';
      (currentData.people || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });

      renderCalendar();
      renderLists();
    }

    function renderCalendar(){
      const weekStart = getWeekStart(weekOffset);
      const today = new Date();
      today.setHours(0,0,0,0);

      // Week label
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      document.getElementById('weekLabel').textContent = weekStart.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' - ' + weekEnd.toLocaleDateString('en-US', {month:'short', day:'numeric'});

      // Build grid
      const cal = document.getElementById('calendar');
      let html = '<div class="calGrid">';
      // Header row
      html += '<div class="calCell calHeader">Trailer</div>';
      for (let i = 0; i < 7; i++){
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const isToday = d.getTime() === today.getTime();
        html += '<div class="calCell calHeader' + (isToday ? ' today' : '') + '">' + fmtDay(d) + '</div>';
      }

      // Trailer rows
      TRAILERS.forEach(trailer => {
        html += '<div class="calCell calLabel">' + trailer + '</div>';
        for (let i = 0; i < 7; i++){
          const dayStart = new Date(weekStart);
          dayStart.setDate(dayStart.getDate() + i);
          const dayEnd = new Date(dayStart);
          dayEnd.setDate(dayEnd.getDate() + 1);
          html += '<div class="calCell calSlot" data-trailer="' + trailer + '" data-day="' + dayStart.toISOString() + '">';
          // Find reservations that overlap this day for this trailer
          const overlaps = (currentData.reservations || []).filter(r => {
            if (r.trailer !== trailer) return false;
            const status = (r.status || '').toLowerCase();
            if (status !== 'reserved' && status !== 'active') return false;
            const rStart = new Date(r.start).getTime();
            const rEnd = new Date(r.end).getTime();
            return rStart < dayEnd.getTime() && rEnd > dayStart.getTime();
          });
          overlaps.forEach(r => {
            const rStart = new Date(r.start);
            const startStr = rStart.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const cls = r.status.toLowerCase() === 'active' ? ' active' : '';
            html += '<div class="calBooking' + cls + '" data-id="' + r.id + '"><div class="bkPerson">' + escapeHtml(r.person) + '</div><div class="bkTime">' + startStr + '</div></div>';
          });
          html += '</div>';
        }
      });

      html += '</div>';
      cal.innerHTML = html;

      // Wire booking clicks
      cal.querySelectorAll('.calBooking').forEach(el => {
        el.addEventListener('click', () => showDetail(el.dataset.id));
      });
    }

    function renderLists(){
      const now = new Date();
      const upcoming = (currentData.reservations || [])
        .filter(r => (r.status || '').toLowerCase() === 'reserved' && new Date(r.start) > now)
        .sort((a, b) => new Date(a.start) - new Date(b.start));
      const active = (currentData.reservations || [])
        .filter(r => {
          const s = (r.status || '').toLowerCase();
          if (s === 'active') return true;
          if (s === 'reserved'){
            const rs = new Date(r.start);
            const re = new Date(r.end);
            return rs <= now && now <= re;
          }
          return false;
        })
        .sort((a, b) => new Date(a.start) - new Date(b.start));

      const upEl = document.getElementById('upcomingList');
      upEl.innerHTML = '';
      if (upcoming.length === 0){
        upEl.innerHTML = '<div class="empty">No upcoming reservations.</div>';
      } else {
        upcoming.slice(0, 20).forEach(r => upEl.appendChild(makeListRow(r)));
      }

      const acEl = document.getElementById('activeList');
      acEl.innerHTML = '';
      if (active.length === 0){
        acEl.innerHTML = '<div class="empty">No trailers currently in use.</div>';
      } else {
        active.forEach(r => acEl.appendChild(makeListRow(r)));
      }
    }

    function makeListRow(r){
      const div = document.createElement('div');
      div.className = 'listItem';
      div.style.cursor = 'pointer';
      const status = (r.status || 'Reserved');
      const bClass = 'b-' + status.toLowerCase();
      const startStr = new Date(r.start).toLocaleString();
      const endStr = new Date(r.end).toLocaleString();
      div.innerHTML = ''
        + '<div class="li-left">'
        + '<div class="li-trailer">' + escapeHtml(r.trailer) + '</div>'
        + '<div class="li-person">' + escapeHtml(r.person) + '</div>'
        + '<div class="li-time">' + startStr + ' &rarr; ' + endStr + '</div>'
        + (r.destination ? '<div class="li-dest">' + escapeHtml(r.destination) + '</div>' : '')
        + '</div>'
        + '<div class="li-status"><span class="badge ' + bClass + '">' + status + '</span></div>';
      div.addEventListener('click', () => showDetail(r.id));
      return div;
    }

    function showDetail(reservationId){
      const r = (currentData.reservations || []).find(x => x.id === reservationId);
      if (!r) return;
      document.getElementById('detailTitle').textContent = r.trailer + ' reservation';
      const startStr = new Date(r.start).toLocaleString();
      const endStr = new Date(r.end).toLocaleString();
      document.getElementById('detailInfo').innerHTML = ''
        + '<div class="detailRow"><span class="k">Trailer</span><span class="v">' + escapeHtml(r.trailer) + '</span></div>'
        + '<div class="detailRow"><span class="k">Person</span><span class="v">' + escapeHtml(r.person) + '</span></div>'
        + '<div class="detailRow"><span class="k">Start</span><span class="v">' + startStr + '</span></div>'
        + '<div class="detailRow"><span class="k">End</span><span class="v">' + endStr + '</span></div>'
        + '<div class="detailRow"><span class="k">Destination</span><span class="v">' + escapeHtml(r.destination || '-') + '</span></div>'
        + (r.notes ? '<div class="detailRow"><span class="k">Notes</span><span class="v">' + escapeHtml(r.notes) + '</span></div>' : '')
        + '<div class="detailRow"><span class="k">Status</span><span class="v">' + escapeHtml(r.status) + '</span></div>';

      const actions = document.getElementById('detailActions');
      const status = (r.status || '').toLowerCase();
      actions.innerHTML = '';
      if (status === 'reserved' || status === 'active'){
        const comp = document.createElement('button');
        comp.className = 'actBtn actComplete';
        comp.textContent = 'Mark completed';
        comp.addEventListener('click', () => updateReservation(r.id, 'Completed'));
        const canc = document.createElement('button');
        canc.className = 'actBtn actCancel';
        canc.textContent = 'Cancel';
        canc.addEventListener('click', () => updateReservation(r.id, 'Cancelled'));
        actions.appendChild(comp);
        actions.appendChild(canc);
      }
      document.getElementById('detailModal').classList.add('show');
    }

    async function updateReservation(id, newStatus){
      try {
        const res = await fetch(COMPLETE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ reservationId: id, newStatus })
        });
        const data = await res.json();
        if (data.ok){
          toast(newStatus === 'Completed' ? 'Marked completed' : 'Cancelled');
          document.getElementById('detailModal').classList.remove('show');
          loadData();
        } else {
          toast('Could not update');
        }
      } catch(e){
        toast('Network error');
      }
    }

    // Reserve modal
    document.getElementById('reserveBtn').addEventListener('click', () => {
      // Default to now + 1 hour
      const now = new Date();
      now.setMinutes(0, 0, 0);
      now.setHours(now.getHours() + 1);
      const later = new Date(now);
      later.setHours(later.getHours() + 8);
      document.getElementById('startInput').value = toLocalDateTimeInput(now);
      document.getElementById('endInput').value = toLocalDateTimeInput(later);
      document.getElementById('errBox').classList.remove('show');
      document.getElementById('reserveModal').classList.add('show');
    });
    document.getElementById('reserveClose').addEventListener('click', () => {
      document.getElementById('reserveModal').classList.remove('show');
    });
    document.getElementById('detailClose').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('show');
    });

    function toLocalDateTimeInput(d){
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    document.getElementById('prevWeek').addEventListener('click', () => { weekOffset--; renderCalendar(); });
    document.getElementById('nextWeek').addEventListener('click', () => { weekOffset++; renderCalendar(); });

    // Submit reservation
    let submitting = false;
    document.getElementById('submitReserve').addEventListener('click', async () => {
      if (submitting) return;
      const trailer = document.getElementById('trailerSel').value;
      const person = document.getElementById('personSel').value;
      const start = document.getElementById('startInput').value;
      const end = document.getElementById('endInput').value;
      const destination = document.getElementById('destInput').value.trim();
      const notes = document.getElementById('notesInput').value.trim();
      const errBox = document.getElementById('errBox');
      errBox.classList.remove('show');

      if (!trailer){ toast('Pick a trailer'); return; }
      if (!person){ toast('Pick your name'); return; }
      if (!start || !end){ toast('Enter start and end times'); return; }
      if (!destination){ toast('Enter destination'); return; }

      submitting = true;
      const btn = document.getElementById('submitReserve');
      btn.disabled = true;
      btn.textContent = 'Reserving...';

      const payload = {
        person, trailer,
        start: new Date(start).toISOString(),
        end: new Date(end).toISOString(),
        destination, notes
      };

      try {
        const res = await fetch(RESERVE_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok){
          toast('Reserved! Confirmation email sent.');
          document.getElementById('reserveModal').classList.remove('show');
          loadData();
        } else {
          errBox.textContent = data.message || 'Could not reserve.';
          errBox.classList.add('show');
        }
      } catch(e){
        errBox.textContent = 'Network error. Try again.';
        errBox.classList.add('show');
      }
      submitting = false;
      btn.disabled = false;
      btn.textContent = 'Reserve';
    });

    function escapeHtml(s){
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Init
    loadData();
  </script>
</body>
</html>
