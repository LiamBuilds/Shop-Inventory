<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --orange-press:#d9760f;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --green-press:#349d6e;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:460px; width:100%; margin:0 auto; padding:20px 22px 28px; display:flex; flex-direction:column; min-height:100dvh;}

  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back{appearance:none; background:none; border:0; padding:8px; margin:-8px 0 -8px -8px; cursor:pointer; color:var(--paper); text-decoration:none; display:flex;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .rule{height:6px; margin:0 0 26px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}

  .loading{text-align:center; padding:40px 20px; color:var(--muted);}

  .statusCard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:22px;}
  .statusCard .idBadge{display:inline-block; background:var(--orange); color:var(--ink); font-weight:700; font-size:13px; padding:4px 10px; border-radius:6px; letter-spacing:.04em;}
  .statusCard h2{font-family:Georgia,serif; font-size:22px; margin:10px 0 4px; color:var(--paper);}
  .statusCard .cat{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .statusCard .divider{height:1px; background:var(--line); margin:14px 0;}
  .statusCard .field{display:flex; justify-content:space-between; padding:6px 0; font-size:15px;}
  .statusCard .field .k{color:var(--muted);}
  .statusCard .field .v{color:var(--paper); font-weight:600; text-align:right;}
  .firstScan{background:rgba(246,137,34,.10); border-color:rgba(246,137,34,.45);}
  .firstScan h2{color:var(--orange);}

  .field-form{margin-bottom:20px;}
  label{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  select,input,textarea{width:100%; appearance:none; background:var(--field); color:var(--paper);
    border:1.5px solid var(--line); border-radius:12px; padding:16px 15px; font-size:17px; font-family:inherit;}
  textarea{resize:vertical; min-height:60px; font-size:15px;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%239a9a9a' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:42px;}
  select:focus, input:focus, textarea:focus{outline:none; border-color:var(--orange);}

  .req{color:var(--orange); font-weight:700; margin-left:2px;}

  .checkbox{display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; cursor:pointer; margin-bottom:20px;}
  .checkbox input{width:20px; height:20px; accent-color:var(--orange); margin:0; padding:0; flex-shrink:0;}
  .checkbox label{margin:0; text-transform:none; letter-spacing:normal; font-size:14px; color:var(--paper); font-weight:400; flex:1;}

  .submit{appearance:none; border:0; border-radius:16px; padding:22px; font-size:19px; font-weight:700; font-family:inherit;
    background:var(--orange); color:var(--ink); cursor:pointer; width:100%; margin-top:6px; transition:transform .06s, background .15s;}
  .submit:active{transform:scale(.985); background:var(--orange-press);}
  .submit:disabled{opacity:.7; cursor:default;}

  .done{display:none; flex-direction:column; align-items:center; text-align:center; flex:1; justify-content:center; padding:20px 0;}
  .done.show{display:flex;}
  .check{width:84px; height:84px; border-radius:50%; background:rgba(63,178,127,.14); display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
  .done h2{font-family:Georgia,serif; font-size:26px; margin:0 0 10px;}
  .done p{color:var(--paper); font-size:17px; margin:0 0 6px; line-height:1.45;}
  .done .acts{display:flex; flex-direction:column; gap:12px; width:100%; margin-top:30px;}
  .ghost{appearance:none; border:2px solid var(--gray); background:transparent; color:var(--paper);
    border-radius:14px; padding:18px; font-size:17px; font-weight:600; font-family:inherit; cursor:pointer; text-decoration:none; text-align:center;}

  .errBox{background:rgba(200,60,60,.14); border:1px solid rgba(200,60,60,.5); border-radius:12px; padding:16px; margin-bottom:16px; color:var(--paper); font-size:14px; display:none;}
  .errBox.show{display:block;}

  .batchBar{margin-bottom:22px;}
  .batchToggle{display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;}
  .batchLabel{color:var(--paper); font-size:15px; font-weight:600;}
  .batchHelp{color:var(--muted); font-weight:400; font-size:13px;}
  .switch{position:relative; display:inline-block; width:44px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switchSlider{position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:var(--gray); border-radius:24px; transition:.2s;}
  .switchSlider:before{position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .switchSlider{background:var(--orange);}
  .switch input:checked + .switchSlider:before{transform:translateX(20px);}
  .batchLogRow{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:6px; display:flex; align-items:center; gap:10px; animation:slideIn .25s;}
  .batchLogRow.pending{opacity:.6;}
  .batchLogRow .icon{width:18px; height:18px; flex-shrink:0;}
  .batchLogRow .rowText{color:var(--paper); font-size:14px; flex:1;}
  .batchLogRow .rowId{color:var(--muted); font-size:12px; margin-left:6px;}
  @keyframes slideIn{from{transform:translateY(-6px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--orange); color:var(--ink); font-weight:700; padding:12px 18px; border-radius:12px;
    opacity:0; pointer-events:none; transition:.25s; font-size:14px; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

  <script>
    const NFC_STATUS_URL   = "https://haggertybuilds.app.n8n.cloud/webhook/nfc-status";
    const NFC_TX_URL       = "https://haggertybuilds.app.n8n.cloud/webhook/nfc-transaction";

    let currentState = null; // { itemId, item, category, currentHolder, currentLocation, currentLocationType, people }
    let t;

    function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(t); t=setTimeout(()=>el.classList.remove('show'),1800); }

    function getIdFromUrl(){
      const params = new URLSearchParams(window.location.search);
      return (params.get('id') || '').trim().toUpperCase();
    }

    async function loadStatus(){
      const id = getIdFromUrl();
      if (!id){
        document.getElementById('loading').textContent = 'No ItemID in URL. This tag may not be programmed yet.';
        return;
      }
      try{
        const res = await fetch(NFC_STATUS_URL + '?id=' + encodeURIComponent(id), { cache:'no-store' });
        const data = await res.json();
        currentState = data;
        renderStatus();
      } catch(e){
        document.getElementById('loading').textContent = 'Could not load status. Check your connection.';
      }
    }

    function renderStatus(){
      if (!currentState || !currentState.ok){
        document.getElementById('loading').textContent = 'Unit not found in system.';
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('mainForm').style.display = 'block';

      document.getElementById('idBadge').textContent = currentState.itemId;
      const card = document.getElementById('statusCard');

      if (currentState.firstScan){
        card.classList.add('firstScan');
        document.getElementById('itemName').textContent = 'First scan of this tag';
        document.getElementById('itemCat').textContent = 'No history yet. Assumed at Shop.';
        document.getElementById('curLoc').textContent = 'Shop';
        document.getElementById('curHolder').textContent = '(none)';
        document.getElementById('lastAction').textContent = '(none)';
      } else {
        document.getElementById('itemName').textContent = currentState.item || currentState.itemId;
        document.getElementById('itemCat').textContent = currentState.category || '';
        document.getElementById('curLoc').textContent = currentState.currentLocation || '(unknown)';
        document.getElementById('curHolder').textContent = currentState.currentHolder || '(none)';
        document.getElementById('lastAction').textContent = currentState.lastAction || '(none)';
      }

      // Populate recipient dropdown - only mitigation-approved people
      const recSel = document.getElementById('recipient');
      recSel.innerHTML = '<option value="" selected disabled>Pick teammate</option>';
      (currentState.people || []).forEach(p => {
        if (p.mitigationApproved && p.name && p.name.toLowerCase() !== (currentState.currentHolder || '').toLowerCase()){
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name;
          recSel.appendChild(opt);
        }
      });

      // Populate "Who are you?" dropdown - only mitigation-approved people
      const whoSel = document.getElementById('whoami');
      whoSel.innerHTML = '<option value="" selected disabled>Pick your name</option>';
      (currentState.people || []).forEach(p => {
        if (p.mitigationApproved){
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name;
          whoSel.appendChild(opt);
        }
      });
      // Restore last-used name from localStorage if available
      const lastName = localStorage.getItem('haggerty_nfc_lastuser');
      if (lastName){
        // Only if that name is still in the dropdown
        for (const opt of whoSel.options){
          if (opt.value === lastName){
            whoSel.value = lastName;
            break;
          }
        }
      }
    }

    // Remember name choice across taps
    document.getElementById('whoami').addEventListener('change', () => {
      const name = document.getElementById('whoami').value;
      if (name) localStorage.setItem('haggerty_nfc_lastuser', name);
    });

    // Action dropdown - show/hide relevant fields
    document.getElementById('action').addEventListener('change', () => {
      const action = document.getElementById('action').value;
      const siteField = document.getElementById('siteField');
      const recipientField = document.getElementById('recipientField');
      const notifyBox = document.getElementById('notifyBox');
      const pickupField = document.getElementById('pickupField');

      // Reset all
      siteField.style.display = 'none';
      recipientField.style.display = 'none';
      notifyBox.style.display = 'none';
      pickupField.style.display = 'none';

      if (action === 'Drop off at site') {
        siteField.style.display = 'block';
      } else if (action === 'Loan to teammate') {
        recipientField.style.display = 'block';
        notifyBox.style.display = 'flex';
      } else if (action === 'Pick back up') {
        pickupField.style.display = 'block';
      }
    });

    // Pickup dropdown - show text input if "to a new site"
    document.getElementById('pickup').addEventListener('change', () => {
      const val = document.getElementById('pickup').value;
      const siteInput = document.getElementById('pickupSite');
      siteInput.style.display = val === '__site' ? 'block' : 'none';
    });

    // Submit
    let submitting = false;
    document.getElementById('submit').addEventListener('click', async () => {
      if (submitting) return;
      const whoami = document.getElementById('whoami').value;
      const action = document.getElementById('action').value;
      const notes = document.getElementById('notes').value.trim();
      const err = document.getElementById('errBox');
      err.classList.remove('show');
      if (!whoami){ toast('Pick your name at the top'); document.getElementById('whoami').focus(); return; }
      if (!action){ toast('Pick an action'); return; }
      if (!currentState || !currentState.ok){ toast('No unit data'); return; }

      // Build the payload based on action
      let from = currentState.currentLocation || 'Shop';
      let to = '';
      // Default: the person tapping now becomes the holder
      let heldBy = whoami;
      let locationType = 'Shop';
      // "previousHolder" for email notification purposes is whoever WAS holding it before this tap
      let previousHolder = currentState.currentHolder || '';
      let notify = false;

      if (action === 'Load into van'){
        to = 'Van';
        locationType = 'Van';
        heldBy = whoami;
      } else if (action === 'Drop off at site'){
        const site = document.getElementById('site').value.trim();
        if (!site){ toast('Enter the site'); document.getElementById('site').focus(); return; }
        to = site;
        locationType = 'Site';
        heldBy = whoami;
      } else if (action === 'Loan to teammate'){
        const recipient = document.getElementById('recipient').value;
        if (!recipient){ toast('Pick who is receiving it'); return; }
        // "From" is the person tapping (giving it away), "To" is the recipient
        from = whoami;
        to = recipient;
        heldBy = recipient;
        // previousHolder is the person tapping now, who is losing custody
        previousHolder = whoami;
        locationType = currentState.currentLocationType || 'Site';
        notify = document.getElementById('notify').checked;
      } else if (action === 'Pick back up'){
        heldBy = whoami;
        const pickup = document.getElementById('pickup').value;
        if (pickup === '__site'){
          const siteVal = document.getElementById('pickupSite').value.trim();
          if (!siteVal){ toast('Enter the site'); document.getElementById('pickupSite').focus(); return; }
          to = siteVal;
          locationType = 'Site';
        } else if (pickup === 'Shop'){
          to = 'Shop';
          locationType = 'Shop';
        } else {
          to = 'Van';
          locationType = 'Van';
        }
      } else if (action === 'Return to shop'){
        to = 'Shop';
        locationType = 'Shop';
        heldBy = ''; // nobody holds it once returned to shop
      }

      submitting = true;
      const btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = 'Recording...';

      const payload = {
        itemId: currentState.itemId,
        item: currentState.item || '',
        category: currentState.category || '',
        action: action,
        from: from,
        to: to,
        heldBy: heldBy,
        locationType: locationType,
        notes: notes,
        previousHolder: previousHolder,
        notify: notify
      };

      try {
        const res = await fetch(NFC_TX_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.ok){
          err.textContent = 'Something went wrong. Try again.';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Record';
          submitting = false;
          return;
        }
        // Success
        document.getElementById('doneLine').textContent = action + ' recorded for ' + (currentState.item || currentState.itemId) + '.';
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('doneScreen').classList.add('show');
      } catch(e){
        err.textContent = 'No signal. Try again.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Record';
        submitting = false;
      }
    });


    // ===== CACHING =====
    const CACHE_KEY_CATALOG = 'haggerty_nfc_catalog_v2';
    const CACHE_KEY_PEOPLE = 'haggerty_nfc_people_v2';
    const CACHE_MINUTES = 30;

    function readCache(key){
      try {
        const raw = sessionStorage.getItem(key);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - (obj.t || 0) > CACHE_MINUTES * 60 * 1000) return null;
        return obj.d;
      } catch(e){ return null; }
    }
    function writeCache(key, data){
      try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), d: data })); } catch(e){}
    }

    // ===== BATCH MODE =====
    let batchMode = false;
    let batchSettings = null; // { whoami, action, site, recipient, notify, pickup, pickupSite }
    let batchCount = 0;

    document.getElementById('batchToggle').addEventListener('change', (e) => {
      batchMode = e.target.checked;
      toggleBatchUI();
    });

    function toggleBatchUI(){
      if (batchMode){
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
        document.getElementById('batchSetup').style.display = 'block';
        document.getElementById('batchActive').style.display = 'none';
        populateBatchSetup();
      } else {
        document.getElementById('batchSetup').style.display = 'none';
        document.getElementById('batchActive').style.display = 'none';
        loadStatus();
      }
    }

    function populateBatchSetup(){
      // Populate name dropdown - only mitigation approved
      const cached = readCache(CACHE_KEY_PEOPLE);
      const whoSel = document.getElementById('batchWhoami');
      whoSel.innerHTML = '<option value="" selected disabled>Pick your name</option>';
      if (cached){
        cached.forEach(p => {
          if (p.mitigationApproved){
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.textContent = p.name;
            whoSel.appendChild(opt);
          }
        });
        // Restore last user
        const last = localStorage.getItem('haggerty_nfc_lastuser');
        if (last) whoSel.value = last;
      } else {
        // Trigger fetch
        prewarmCache();
      }

      // Populate recipient dropdown too
      const recSel = document.getElementById('batchRecipient');
      recSel.innerHTML = '<option value="" selected disabled>Pick teammate</option>';
      if (cached){
        cached.forEach(p => {
          if (p.mitigationApproved){
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.textContent = p.name;
            recSel.appendChild(opt);
          }
        });
      }
    }

    // Batch mode: dynamic field visibility
    document.getElementById('batchAction').addEventListener('change', () => {
      const action = document.getElementById('batchAction').value;
      document.getElementById('batchSiteField').style.display = action === 'Drop off at site' ? 'block' : 'none';
      document.getElementById('batchRecipientField').style.display = action === 'Loan to teammate' ? 'block' : 'none';
      document.getElementById('batchPickupField').style.display = action === 'Pick back up' ? 'block' : 'none';
    });

    document.getElementById('batchPickup').addEventListener('change', () => {
      const val = document.getElementById('batchPickup').value;
      document.getElementById('batchPickupSite').style.display = val === '__site' ? 'block' : 'none';
    });

    // Session persistence
    const BATCH_KEY = 'haggerty_nfc_batch_active';
    function saveBatchSession(){
      if (batchSettings){
        sessionStorage.setItem(BATCH_KEY, JSON.stringify({ settings: batchSettings, count: batchCount }));
      } else {
        sessionStorage.removeItem(BATCH_KEY);
      }
    }
    function loadBatchSession(){
      try {
        const raw = sessionStorage.getItem(BATCH_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch(e){ return null; }
    }

    // Start batch mode
    document.getElementById('batchStart').addEventListener('click', () => {
      const whoami = document.getElementById('batchWhoami').value;
      const action = document.getElementById('batchAction').value;
      if (!whoami){ toast('Pick your name'); return; }
      if (!action){ toast('Pick an action'); return; }

      const settings = { whoami, action };
      if (action === 'Drop off at site'){
        const site = document.getElementById('batchSite').value.trim();
        if (!site){ toast('Enter the site'); return; }
        settings.site = site;
      } else if (action === 'Loan to teammate'){
        const recipient = document.getElementById('batchRecipient').value;
        if (!recipient){ toast('Pick who is receiving'); return; }
        settings.recipient = recipient;
      } else if (action === 'Pick back up'){
        const pickup = document.getElementById('batchPickup').value;
        settings.pickup = pickup;
        if (pickup === '__site'){
          const psite = document.getElementById('batchPickupSite').value.trim();
          if (!psite){ toast('Enter the site'); return; }
          settings.pickupSite = psite;
        }
      }

      batchSettings = settings;
      batchCount = 0;
      localStorage.setItem('haggerty_nfc_lastuser', whoami);
      saveBatchSession();
      startBatchActive();
    });

    function startBatchActive(){
      document.getElementById('batchSetup').style.display = 'none';
      document.getElementById('batchActive').style.display = 'block';
      document.getElementById('batchActionLabel').textContent = batchSettings.action;
      let details = 'by ' + batchSettings.whoami;
      if (batchSettings.site) details += ' at ' + batchSettings.site;
      if (batchSettings.recipient) details += ' -> ' + batchSettings.recipient;
      document.getElementById('batchDetails').textContent = details;
      document.getElementById('batchCounter').textContent = '0';
      document.getElementById('batchLog').innerHTML = '';

      // If we have an id in the URL right now, immediately record it
      const id = getIdFromUrl();
      if (id) recordBatchTap(id);
    }

    // Exit batch mode
    document.getElementById('batchExit').addEventListener('click', () => {
      batchMode = false;
      document.getElementById('batchToggle').checked = false;
      batchSettings = null;
      batchCount = 0;
      sessionStorage.removeItem(BATCH_KEY);
      document.getElementById('batchActive').style.display = 'none';
      document.getElementById('batchSetup').style.display = 'none';
      loadStatus();
    });

    // The core batch tap recorder - optimistic UI
    function recordBatchTap(itemId){
      const id = itemId.toUpperCase();

      // Add pending row immediately for optimistic UI
      const logEl = document.getElementById('batchLog');
      const row = document.createElement('div');
      row.className = 'batchLogRow pending';
      row.innerHTML = '<div class="rowText">Recording... <span class="rowId">' + id + '</span></div>';
      logEl.insertBefore(row, logEl.firstChild);

      // Look up catalog entry
      const catalog = readCache(CACHE_KEY_CATALOG) || {};
      const catEntry = catalog[id] || { item: '', category: '' };

      // Build payload based on batch settings
      const s = batchSettings;
      let from = 'Shop';
      let to = '';
      let heldBy = s.whoami;
      let locationType = 'Shop';
      let previousHolder = '';
      let notify = false;

      if (s.action === 'Load into van'){
        to = 'Van';
        locationType = 'Van';
      } else if (s.action === 'Drop off at site'){
        to = s.site;
        locationType = 'Site';
        from = 'Van'; // assuming they just came from van
      } else if (s.action === 'Loan to teammate'){
        from = s.whoami;
        to = s.recipient;
        heldBy = s.recipient;
        previousHolder = s.whoami;
        locationType = 'Site';
        notify = false;
      } else if (s.action === 'Pick back up'){
        if (s.pickup === '__site'){ to = s.pickupSite; locationType = 'Site'; }
        else if (s.pickup === 'Shop'){ to = 'Shop'; locationType = 'Shop'; }
        else { to = 'Van'; locationType = 'Van'; }
        from = 'Site';
      } else if (s.action === 'Return to shop'){
        to = 'Shop';
        locationType = 'Shop';
        heldBy = '';
        from = 'Van';
      }

      const payload = {
        itemId: id,
        item: catEntry.item,
        category: catEntry.category,
        action: s.action,
        from, to, heldBy, locationType,
        notes: '',
        previousHolder,
        notify
      };

      // Fire the write - optimistic UI updates immediately
      fetch(NFC_TX_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      }).then(r => r.json()).then(data => {
        if (data.ok){
          row.classList.remove('pending');
          const label = catEntry.item ? (catEntry.item + ' (' + id + ')') : id;
          row.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3fb27f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><div class="rowText">' + label + ' &middot; ' + s.action + '</div>';
          batchCount++;
          document.getElementById('batchCounter').textContent = batchCount;
          saveBatchSession();
          if (navigator.vibrate) navigator.vibrate(50);
        } else {
          row.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div class="rowText" style="color:#c0392b;">Failed: ' + id + '</div>';
        }
      }).catch(e => {
        row.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div class="rowText" style="color:#c0392b;">Network error: ' + id + '</div>';
      });
    }

    // ===== PREWARM CACHE (fetch people + catalog once, cache for 30 min) =====
    async function prewarmCache(){
      const cachedPeople = readCache(CACHE_KEY_PEOPLE);
      const cachedCatalog = readCache(CACHE_KEY_CATALOG);
      if (cachedPeople && cachedCatalog) return;

      // Use any ItemID to trigger a fetch that includes people + catalog
      // Just use a dummy that won't match anything; we only care about the metadata
      try {
        const res = await fetch(NFC_STATUS_URL + '?id=DUMMY', { cache: 'no-store' });
        const data = await res.json();
        if (data.people) writeCache(CACHE_KEY_PEOPLE, data.people);
        // Catalog: reconstruct from any items we can see. Actually the current API doesn\'t return the full catalog.
        // For now, we can only cache the people list.
      } catch(e){}
    }

    // ===== INIT =====
    // Prewarm on load
    prewarmCache();

    // Check if batch mode was active from a previous scan
    const savedBatch = loadBatchSession();
    if (savedBatch){
      batchMode = true;
      batchSettings = savedBatch.settings;
      batchCount = savedBatch.count || 0;
      document.getElementById('batchToggle').checked = true;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('batchSetup').style.display = 'none';
      document.getElementById('batchActive').style.display = 'block';
      // Populate the active screen
      document.getElementById('batchActionLabel').textContent = batchSettings.action;
      let details = 'by ' + batchSettings.whoami;
      if (batchSettings.site) details += ' at ' + batchSettings.site;
      if (batchSettings.recipient) details += ' -> ' + batchSettings.recipient;
      document.getElementById('batchDetails').textContent = details;
      document.getElementById('batchCounter').textContent = batchCount;

      // If URL has an ItemID, immediately record it
      const id = getIdFromUrl();
      if (id){
        recordBatchTap(id);
      }
    } else {
      // Normal mode - load status card
      loadStatus();
    }
  </script>
</body>
