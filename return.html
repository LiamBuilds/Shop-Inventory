<style>
  :root{
    --bg:#232323; --card:#2b2b2b; --line:#3a3a3a; --field:#2b2b2b;
    --orange:#F68922; --orange-press:#d9760f;
    --ink:#1b1b1b; --paper:#f4f4f2; --muted:#9a9a9a; --gray:#4D4D4D;
    --green:#3fb27f; --green-press:#34a06f; --red:#e25c4e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--paper);
    font-family:"Calibri","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:460px; width:100%; margin:0 auto; padding:20px 22px 28px; display:flex; flex-direction:column; min-height:100dvh;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back{appearance:none; background:none; border:0; padding:8px; margin:-8px 0 -8px -8px; cursor:pointer; color:var(--paper); text-decoration:none; display:flex;}
  .mark{height:34px; width:auto;}
  .htitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:17px;}
  .rule{height:6px; margin:0 0 26px; border-radius:4px;
    background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#2b2b2b 14px 26px);}
  .lead{font-family:Georgia,serif; font-size:21px; margin:0 0 22px;}
  .field{margin-bottom:20px;}
  label{display:block; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  select{width:100%; appearance:none; background:var(--field); color:var(--paper);
    border:1.5px solid var(--line); border-radius:12px; padding:16px 15px; font-size:17px; font-family:inherit;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%239a9a9a' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center; padding-right:42px;}
  select:focus{outline:none; border-color:var(--orange);}
  .items{display:flex; flex-direction:column; gap:12px;}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .item.overdue{border-color:var(--red); background:rgba(226,92,78,.08);}
  .item .info{flex:1; min-width:0;}
  .item .nm{font-size:17px; font-weight:600; margin-bottom:4px; word-wrap:break-word;}
  .item .meta{font-size:13px; color:var(--muted);}
  .item.overdue .meta{color:var(--red); font-weight:600;}
  .ret{appearance:none; border:0; border-radius:12px; padding:14px 18px; font-size:15px; font-weight:700; font-family:inherit;
    background:var(--green); color:var(--ink); cursor:pointer; transition:transform .06s, background .15s; flex-shrink:0;}
  .ret:active{transform:scale(.95); background:var(--green-press);}
  .ret:disabled{opacity:.5; cursor:default;}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-style:italic;}
  .empty.success{color:var(--green); font-style:normal;}
  .undoBar{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:60;
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.35); padding:12px 14px; display:none; align-items:center; gap:12px;
    max-width:92%; min-width:280px;}
  .undoBar.show{display:flex;}
  .undoBar .msg{color:var(--paper); font-size:14px; line-height:1.3; flex:1;}
  .undoBar .msg b{color:var(--paper);}
  .undoBar .undoBtn{appearance:none; background:var(--orange); color:var(--ink); border:0;
    border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
  .undoBar .undoBtn:disabled{opacity:.7; cursor:default;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--orange); color:var(--ink); font-weight:700; padding:12px 18px; border-radius:12px;
    opacity:0; pointer-events:none; transition:.25s; font-size:14px; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.green{background:var(--green);}
  /* Return accountability modal */
  .returnModal{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:80; display:none; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}
  .returnModal.show{display:flex;}
  .returnModal .box{background:var(--bg); border:1.5px solid var(--line); border-radius:16px; padding:24px; max-width:420px; width:100%; margin:auto;}
  .returnModal h3{font-family:Georgia,serif; font-size:20px; margin:0 0 18px; color:var(--paper);}
  .returnModal .req{color:var(--orange); font-weight:700; margin-left:2px;}
  .returnModal textarea{width:100%; background:var(--field); color:var(--paper); border:1.5px solid var(--line);
    border-radius:12px; padding:14px 15px; font-size:16px; font-family:inherit; resize:vertical; min-height:64px;}
  .returnModal textarea:focus{outline:none; border-color:var(--orange);}
  .notesRow{display:flex; gap:10px; align-items:flex-start;}
  .notesRow textarea{flex:1;}
  .micBtn{appearance:none; background:var(--card); border:1.5px solid var(--line); color:var(--paper);
    border-radius:12px; width:52px; height:52px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:all .15s;}
  .micBtn:active{transform:scale(.95);}
  .micBtn.recording{background:var(--orange); color:var(--ink); border-color:var(--orange); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,137,34,.5);} 50%{box-shadow:0 0 0 8px rgba(246,137,34,0);}}
  .micStatus{margin-top:8px; padding:8px 12px; border-radius:8px; font-size:13px;
    background:rgba(246,137,34,.10); color:var(--paper); border:1px solid rgba(246,137,34,.35);}
  .micStatus.err{background:rgba(226,92,78,.10); border-color:rgba(226,92,78,.35);}
  .photoBtn{appearance:none; width:100%; background:var(--card); border:1.5px dashed var(--line); color:var(--paper);
    border-radius:12px; padding:16px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;}
  .photoPreviewWrap{display:flex; align-items:center; gap:12px;}
  .photoPreviewWrap img{width:76px; height:76px; object-fit:cover; border-radius:10px; border:1.5px solid var(--line); flex-shrink:0;}
  .photoRetake{appearance:none; background:transparent; border:1.5px solid var(--gray); color:var(--paper);
    padding:10px 14px; border-radius:9px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;}
  .verifyBox{padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.4;
    background:rgba(154,154,154,.10); border:1px solid var(--line); color:var(--muted);}
  .verifyBox.ok{background:rgba(63,178,127,.14); border-color:rgba(63,178,127,.5); color:var(--paper);}
  .verifyBox.warn{background:rgba(226,92,78,.10); border-color:rgba(226,92,78,.4); color:var(--paper);}
  .qrScanArea{margin-top:10px; border-radius:14px; overflow:hidden; background:#000; position:relative; aspect-ratio:1; max-width:220px;}
  .qrScanArea video{width:100%; height:100%; object-fit:cover; display:block;}
  .scanFallback{appearance:none; background:transparent; border:0; color:var(--orange); font-size:14px; font-family:inherit;
    cursor:pointer; padding:8px 0; text-decoration:underline; margin-top:4px;}
  .returnModal .buttons{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
  .returnModal button.continue{appearance:none; border:0; border-radius:12px; padding:15px; font-size:15px; font-weight:700;
    font-family:inherit; cursor:pointer; background:var(--green); color:var(--ink);}
  .returnModal button.continue:disabled{opacity:.5; cursor:default;}
  .returnModal button.cancel{appearance:none; border:1.5px solid var(--gray); border-radius:12px; padding:15px; font-size:15px;
    font-weight:600; font-family:inherit; cursor:pointer; background:transparent; color:var(--paper);}
  .privacyNote{color:var(--muted); font-size:12px; line-height:1.5; text-align:center; margin-top:auto; padding-top:24px;}
</style>
</head>

    const SUPABASE_URL       = "https://tdflgfuqjnwctadsjizz.supabase.co";

    const SHOP_QR_VALUE = "HAGGERTY-SHOP-VERIFY";
    function haversineMeters(lat1, lon1, lat2, lon2){
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    let t;
    function toast(m, green){
      const e=document.getElementById('toast');
      e.textContent=m;
      e.classList.toggle('green', !!green);
      e.classList.add('show');
      clearTimeout(t);
      t=setTimeout(()=>e.classList.remove('show'),2200);
    }
    // ---- UNDO SUPPORT ----
    let undoTimer = null;
    let undoCountdown = null;
    function showUndoBar(item, checkoutId){
      const bar = document.getElementById('undoBar');
      const msg = document.getElementById('undoMsg');
      const btn = document.getElementById('undoBtn');
      const expiresAt = Date.now() + UNDO_WINDOW_MS;
      function refresh(){
        const remaining = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
        if (remaining <= 0) { hideUndoBar(); return; }
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        const timeStr = mins > 0 ? mins + ':' + String(secs).padStart(2, '0') : secs + 's';
        msg.innerHTML = '<b>' + item + '</b> returned. Undo available (' + timeStr + ')';
      }
      refresh();
      bar.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Undo';
      undoCountdown = setInterval(refresh, 1000);
      undoTimer = setTimeout(hideUndoBar, UNDO_WINDOW_MS);
      btn.onclick = async () => {
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = 'Undoing...';
        try {
          const res = await fetch(UNDO_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({checkoutId})
          });
          if (!res.ok) throw new Error('bad response');
          hideUndoBar();
          toast(item + ' restored', true);
          // Re-load the list so the item shows back up
          const sel = document.getElementById('name');
          if (sel && sel.value) sel.dispatchEvent(new Event('change'));
        } catch(err) {
          toast('Undo failed, try again');
          btn.disabled = false;
          btn.textContent = 'Undo';
        }
      };
    }
    function hideUndoBar(){
      const bar = document.getElementById('undoBar');
      bar.classList.remove('show');
      if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
      if (undoCountdown) { clearInterval(undoCountdown); undoCountdown = null; }
    }
    const fmt = d => {
      if(!d) return '';
      const dt = new Date(d);
      if(isNaN(dt)) return d;
      return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
    };
    const daysUntil = d => {
      if(!d) return null;
      const dt = new Date(d);
      if(isNaN(dt)) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      dt.setHours(0,0,0,0);
      return Math.round((dt - today) / 86400000);
    };
    // 5-minute cache — reused across checkout and return pages
    const CACHE_KEY = 'haggerty_shop_lists_v1';
    const CACHE_MINUTES = 5;
    function readCache(){
      try{
        const raw = sessionStorage.getItem(CACHE_KEY);
        if(!raw) return null;
        const obj = JSON.parse(raw);
        if(Date.now() - (obj.savedAt||0) > CACHE_MINUTES*60*1000) return null;
        return obj.data;
      } catch(e){ return null; }
    }
    function writeCache(data){
      try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify({savedAt: Date.now(), data})); } catch(e){}
    }
    function fillNames(data){
      const sel = document.getElementById('name');
      const ph = document.getElementById('namePlaceholder');
      if(ph) ph.textContent = 'Select your name';
      // Clear any names already added
      Array.from(sel.querySelectorAll('option')).forEach(o => { if(!o.disabled) o.remove(); });
      (data.people || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = p.name;
        sel.appendChild(opt);
      });
    }
    async function loadPeople(){
      // Instant fill from cache if available
      const cached = readCache();
      if(cached) fillNames(cached);
      // Fetch fresh in background so data stays live
      try{
        const res = await fetch(GET_LISTS_URL, {cache:'no-store'});
        const data = await res.json();
        writeCache(data);
        fillNames(data);
      } catch(e){
        if(!cached) toast('Could not load names');
      }
    }
    loadPeople();
    // Load items when name selected
    document.getElementById('name').addEventListener('change', async (e) => {
      const person = e.target.value;
      if(!person) return;
      await loadItems(person);
    });
    async function loadItems(person){
      const itemsArea = document.getElementById('itemsArea');
      const emptyState = document.getElementById('emptyState');
      const list = document.getElementById('items');
      list.innerHTML = '<div class="empty">Loading…</div>';
      itemsArea.style.display = 'block';
      emptyState.style.display = 'none';
      try{
        const url = GET_MY_ITEMS_URL + '?person=' + encodeURIComponent(person);
        const res = await fetch(url, {cache:'no-store'});
        const data = await res.json();
        renderItems(data.items || []);
      } catch(e){
        list.innerHTML = '<div class="empty">Could not load items. Try again.</div>';
      }
    }
    function renderItems(items){
      const list = document.getElementById('items');
      const itemsArea = document.getElementById('itemsArea');
      const emptyState = document.getElementById('emptyState');
      if(items.length === 0){
        itemsArea.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.classList.remove('success');
        return;
      }
      list.innerHTML = '';
      items.forEach(it => {
        const days = daysUntil(it.dueBack);
        const overdue = days !== null && days < 0;
        const card = document.createElement('div');
        card.className = 'item' + (overdue ? ' overdue' : '');
        let dueLabel = '';
        if(it.dueBack){
          if(overdue) dueLabel = 'Overdue · was due ' + fmt(it.dueBack);
          else if(days === 0) dueLabel = 'Due back today';
          else if(days === 1) dueLabel = 'Due back tomorrow';
          else dueLabel = 'Due back ' + fmt(it.dueBack);
        } else {
          dueLabel = 'No return date set';
        }
        card.innerHTML = `
          <div class="info">
            <div class="nm"></div>
            <div class="meta"></div>
          </div>
          <button class="ret">Return</button>
        `;
        card.querySelector('.nm').textContent = it.item;
        card.querySelector('.meta').textContent = dueLabel;
        const btn = card.querySelector('.ret');
        btn.addEventListener('click', () => {
          if(btn.disabled) return;
          if(window.__returning){ toast('Please wait…'); return; }
          openReturnModal({ item: it.item, checkoutId: it.checkoutId, card, btn, list, itemsArea, emptyState });
        });
        list.appendChild(card);
      });
    }
    // Runs the shared post-return cleanup: undo bar, card removal, re-enabling other Return buttons
    function completeReturn(ctx){
      showUndoBar(ctx.item, ctx.checkoutId);
      ctx.card.style.transition = 'opacity .3s, transform .3s';
      ctx.card.style.opacity = '0';
      ctx.card.style.transform = 'translateX(20px)';
      setTimeout(() => {
        ctx.card.remove();
        if(ctx.list.children.length === 0){
          ctx.itemsArea.style.display = 'none';
          ctx.emptyState.style.display = 'block';
          ctx.emptyState.classList.add('success');
          ctx.emptyState.textContent = "All caught up. Nothing else to return.";
        }
        window.__returning = false;
        document.querySelectorAll('.ret').forEach(b => { b.disabled = false; });
      }, 320);
    }
    // ==================================================================
    // Return accountability modal: mandatory notes, photo, and GPS/QR verification
    // ==================================================================
    let currentReturnCtx = null;
    let returnPhotoFile = null;

    let geoWatchActive = false;
    function updateConfirmEnabled(){
      const notes = document.getElementById('returnNotes').value.trim();
      const btn = document.getElementById('confirmReturn');
      btn.disabled = !(notes && returnPhotoFile && returnVerification);
    }

      document.getElementById('returnNotes').value = '';
      const ms = document.getElementById('returnMicStatus'); ms.style.display = 'none'; ms.classList.remove('err');

      document.getElementById('photoPreviewWrap').style.display = 'none';
      document.getElementById('photoBtn').style.display = 'block';

    }
    function openReturnModal(ctx){
      currentReturnCtx = ctx;
      resetReturnModalState();
      document.getElementById('returnModal').classList.add('show');
      startGeoCheck();
    }
    function closeReturnModal(){
      document.getElementById('returnModal').classList.remove('show');
      stopQrFallbackScanner();
      currentReturnCtx = null;
    }
    // ---- GPS geofence check ----
    function startGeoCheck(){
      const vs = document.getElementById('verifyStatus');
      const qrBtn = document.getElementById('qrFallbackBtn');
      if(!('geolocation' in navigator)){
        vs.className = 'verifyBox warn';
        vs.textContent = "Your browser can't check location here.";
        qrBtn.style.display = 'block';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          const dist = haversineMeters(lat, lng, SHOP_LAT, SHOP_LNG);
          if(dist <= SHOP_RADIUS_METERS){
            returnVerification = { method: 'gps', lat, lng };
            vs.className = 'verifyBox ok';
            vs.textContent = "You're at the shop. Location verified.";
            qrBtn.style.display = 'none';
            stopQrFallbackScanner();
          } else {
            vs.className = 'verifyBox warn';
            vs.textContent = "Doesn't look like you're at the shop. Scan the QR code posted there instead.";
            qrBtn.style.display = 'block';
          }
          updateConfirmEnabled();
        },
        () => {
          vs.className = 'verifyBox warn';
          vs.textContent = "Couldn't get your location. Scan the QR code at the shop instead.";
          qrBtn.style.display = 'block';
          updateConfirmEnabled();
        },
        { timeout: 8000, maximumAge: 60000 }
      );
    }
    // ---- QR fallback scanner (reuses the same lightweight jsQR approach as checkout) ----
    let qrStream = null;
    let qrScannerRunning = false;
    const qrCanvas = document.createElement('canvas');
    const qrCtx = qrCanvas.getContext('2d');
    async function startQrFallbackScanner(){
      const area = document.getElementById('qrScanArea');
      const video = document.getElementById('returnScanVideo');
      try{
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = qrStream;
        await video.play();
        area.style.display = 'block';
        qrScannerRunning = true;
        requestAnimationFrame(qrScanTick);
      } catch(e){
        toast('Could not open camera for QR scan');
      }
    }
    function stopQrFallbackScanner(){
      qrScannerRunning = false;
      document.getElementById('qrScanArea').style.display = 'none';
      if(qrStream){ qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
    }
    function qrScanTick(){
      if(!qrScannerRunning) return;
      const video = document.getElementById('returnScanVideo');
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        qrCanvas.width = video.videoWidth;
        qrCanvas.height = video.videoHeight;
        qrCtx.drawImage(video, 0, 0, qrCanvas.width, qrCanvas.height);
        try{
          const imgData = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
          if(code && code.data && code.data.trim().toUpperCase() === SHOP_QR_VALUE){
            returnVerification = { method: 'qr' };
            const vs = document.getElementById('verifyStatus');
            vs.className = 'verifyBox ok';
            vs.textContent = 'Shop QR code scanned. Location verified.';
            document.getElementById('qrFallbackBtn').style.display = 'none';
            stopQrFallbackScanner();
            updateConfirmEnabled();
            return;
          }
        } catch(e){ /* keep trying */ }
      }
      requestAnimationFrame(qrScanTick);
    }
    document.getElementById('qrFallbackBtn').addEventListener('click', () => {
      if(qrScannerRunning) return;
      startQrFallbackScanner();
    });
    // ---- Photo capture ----
    document.getElementById('photoBtn').addEventListener('click', () => {
      document.getElementById('photoInput').click();
    });
    document.getElementById('photoInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      returnPhotoFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('photoPreview').src = ev.target.result;
        document.getElementById('photoPreviewWrap').style.display = 'flex';
        document.getElementById('photoBtn').style.display = 'none';
      };
      reader.readAsDataURL(file);
      updateConfirmEnabled();
    });
    document.getElementById('photoRetake').addEventListener('click', () => {
      returnPhotoFile = null;
      document.getElementById('photoInput').value = '';
      document.getElementById('photoPreviewWrap').style.display = 'none';
      document.getElementById('photoBtn').style.display = 'block';
      updateConfirmEnabled();
    });
    document.getElementById('returnNotes').addEventListener('input', updateConfirmEnabled);
    document.getElementById('cancelReturn').addEventListener('click', closeReturnModal);
    document.getElementById('returnModal').addEventListener('click', (e) => {
      if(e.target.id === 'returnModal') closeReturnModal();
    });
    // ---- Upload the photo straight to Supabase Storage from the browser ----
    async function uploadReturnPhoto(file, checkoutId){
      const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop() : (file.type.split('/')[1] || 'jpg');
      const path = checkoutId.replace(/[^a-zA-Z0-9-_]/g,'') + '-' + Date.now() + '.' + ext;
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${RETURN_PHOTO_BUCKET}/${path}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': file.type || 'image/jpeg'
        },
        body: file
      });
      if(!res.ok) throw new Error('photo upload failed');
      return path;
    }
    // ---- Confirm Return ----
    document.getElementById('confirmReturn').addEventListener('click', async () => {
      const ctx = currentReturnCtx;
      if(!ctx) return;
      const btn = document.getElementById('confirmReturn');
      const notes = document.getElementById('returnNotes').value.trim();
      if(!notes || !returnPhotoFile || !returnVerification){ updateConfirmEnabled(); return; }
      window.__returning = true;
      btn.disabled = true;
      btn.textContent = 'Uploading photo…';
      try{
        const photoPath = await uploadReturnPhoto(returnPhotoFile, ctx.checkoutId);
        btn.textContent = 'Returning…';
        const res = await fetch(RETURN_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            checkoutId: ctx.checkoutId,
            notes: notes,
            photoPath: photoPath,
            verificationMethod: returnVerification.method,
            lat: returnVerification.lat != null ? returnVerification.lat : null,
            lng: returnVerification.lng != null ? returnVerification.lng : null
          })
        });
        const data = await res.json().catch(() => null);
        if(!res.ok || (data && data.ok === false)){
          const msg = (data && data.message) ? data.message : 'Could not return, try again';
          toast(msg);
          btn.disabled = false;
          btn.textContent = 'Confirm Return';
          window.__returning = false;
          return;
        }
        // Small delay so the write fully commits before the next return can fire
        await new Promise(r => setTimeout(r, 1200));
        closeReturnModal();
        document.querySelectorAll('.ret').forEach(b => { b.disabled = true; });
        completeReturn(ctx);
        btn.disabled = false;
        btn.textContent = 'Confirm Return';
      } catch(e){
        toast('Could not return, try again');
        btn.disabled = false;
        btn.textContent = 'Confirm Return';
        window.__returning = false;
      }
    });
    // ---- Voice notes for the return modal (Web Speech API), same pattern as checkout ----
    (function setupReturnMic(){
      const btn = document.getElementById('returnMicBtn');
      const notes = document.getElementById('returnNotes');
      const status = document.getElementById('returnMicStatus');
      if(!btn || !notes) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SpeechRecognition){
        btn.disabled = true;
        btn.style.opacity = 0.4;
        btn.title = "Voice notes not supported on this browser";
        return;
      }
      let recognition = null;
      let isRecording = false;
      let sessionBase = "";
      let finalTranscript = "";
      function startRecording(){
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        sessionBase = notes.value ? notes.value.trim() + " " : "";
        finalTranscript = "";
        recognition.onresult = (event) => {
          let interim = "";
          for(let i = event.resultIndex; i < event.results.length; i++){
            const chunk = event.results[i][0].transcript;
            if(event.results[i].isFinal) finalTranscript += chunk + " ";
            else interim += chunk;
          }
          notes.value = (sessionBase + finalTranscript + interim).trim();
          updateConfirmEnabled();
        };
        recognition.onerror = (e) => {
          status.textContent = "Mic error: " + e.error + ". You can still type.";
          status.style.display = "block";
          status.classList.add("err");
          stopRecording(true);
        };
        recognition.onend = () => {
          if(isRecording){
            try{ recognition.start(); } catch(e){ stopRecording(true); }
          }
        };
        try{
          recognition.start();
          isRecording = true;
          btn.classList.add("recording");
          status.classList.remove("err");
          status.textContent = "Recording... tap the mic again to stop.";
          status.style.display = "block";
        } catch(e){
          status.textContent = "Could not start mic. Check permissions.";
          status.classList.add("err");
          status.style.display = "block";
        }
      }
      function stopRecording(errored){
        isRecording = false;
        btn.classList.remove("recording");
        if(recognition){ try{ recognition.stop(); } catch(e){} recognition = null; }
        if(!errored){
          if(notes.value.trim()){
            status.textContent = "Recorded. Edit above if needed.";
            status.style.display = "block";
          } else {
            status.style.display = "none";
          }
        }
      }
      btn.addEventListener("click", () => {
        if(isRecording) stopRecording(false);
        else startRecording();
      });
    })();
  </script>
</body>
